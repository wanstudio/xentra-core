name: Passenger Audit (read-only)

# Diagnostic for docs/DEPLOYMENT.md. Read-only: discovers the app.mybangjo.com
# vhost docroot and Passenger state. No writes to production.
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.XENTRA_SSH_KEY }}
          SSH_HOST: ${{ secrets.XENTRA_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/xentra_key
          chmod 600 ~/.ssh/xentra_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Audit server state
        env:
          SSH_HOST: ${{ secrets.XENTRA_SSH_HOST }}
          SSH_USER: ${{ secrets.XENTRA_SSH_USER }}
          SSH_PORT: ${{ secrets.XENTRA_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/xentra_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -x
          echo "== whoami/pwd =="; whoami; pwd; id
          echo "== home top-level =="; ls -la ~ 2>/dev/null | head -40
          echo "== app root =="; ls -la /home/mybangjo/xentra-core 2>/dev/null | head -25
          echo "== app .htaccess =="; cat /home/mybangjo/xentra-core/.htaccess 2>/dev/null | head -40
          echo "== restart marker =="; ls -la /home/mybangjo/xentra-core/tmp 2>/dev/null
          echo "== node venv =="; /home/mybangjo/nodevenv/xentra-core/20/bin/node --version 2>/dev/null || echo "venv20 missing"
          echo "== candidate docroots =="
          for d in ~/public_html ~/app.mybangjo.com ~/dev.mybangjo.com /home/mybangjo/public_html /home/mybangjo/app.mybangjo.com; do
            if [ -e "$d" ]; then echo "--- $d ---"; ls -la "$d" 2>/dev/null | head -15; echo "..htaccess:"; head -50 "$d/.htaccess" 2>/dev/null; fi
          done
          echo "== find wp-config (docroot guess) =="
          find ~ -maxdepth 3 -name wp-config.php 2>/dev/null | head -10
          echo "== passenger.log tail =="
          tail -40 /home/mybangjo/xentra-core/passenger.log 2>/dev/null || echo "no passenger.log"
          echo "== local curl checks =="
          for url in "http://127.0.0.1/health" "http://127.0.0.1/api/v1/promotions/active?is_pwa=0&phone="; do
            echo "--- $url ---"; curl -sS -m 8 -w '\n[HTTP %{http_code}]\n' "$url" 2>&1 | head -6
          done
          echo "== public curl checks =="
          for url in "https://app.mybangjo.com/health" "https://app.mybangjo.com/api/v1/promotions/active?is_pwa=0&phone="; do
            echo "--- $url ---"; curl -sS -m 12 -w '\n[HTTP %{http_code}]\n' "$url" 2>&1 | head -6
          done
          REMOTE
