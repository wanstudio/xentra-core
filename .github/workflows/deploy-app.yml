name: Deploy Xentra Core to app.mybangjo.com

on:
  push:
    branches:
      - main

concurrency:
  group: xentra-app-deploy
  cancel-in-progress: true

env:
  DEPLOY_ROOT: /home/mybangjo/xentra-core
  DEPLOY_ARCHIVE: /home/mybangjo/xentra-core-deploy.zip
  NODE_VENV: /home/mybangjo/nodevenv/xentra-core/20

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Xentra Core
        run: |
          zip -r xentra-core-deploy.zip . \
            -x "node_modules/*" ".git/*" "tmp/*" ".env" ".env.*" ".htaccess"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.XENTRA_SSH_KEY }}
          SSH_HOST: ${{ secrets.XENTRA_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/xentra_deploy_key
          chmod 600 ~/.ssh/xentra_deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload package
        env:
          SSH_HOST: ${{ secrets.XENTRA_SSH_HOST }}
          SSH_USER: ${{ secrets.XENTRA_SSH_USER }}
          SSH_PORT: ${{ secrets.XENTRA_SSH_PORT }}
        run: |
          scp -i ~/.ssh/xentra_deploy_key \
            -P "$SSH_PORT" \
            xentra-core-deploy.zip \
            "$SSH_USER@$SSH_HOST:${{ env.DEPLOY_ARCHIVE }}"

      - name: Deploy and restart Passenger
        env:
          SSH_HOST: ${{ secrets.XENTRA_SSH_HOST }}
          SSH_USER: ${{ secrets.XENTRA_SSH_USER }}
          SSH_PORT: ${{ secrets.XENTRA_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/xentra_deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -e

          APP="/home/mybangjo/xentra-core"
          ARCHIVE="/home/mybangjo/xentra-core-deploy.zip"
          VENV="/home/mybangjo/nodevenv/xentra-core/20"

          test -d "$APP"
          test -f "$ARCHIVE"
          cd "$APP"

          # Keep the existing dependency directory until the new install succeeds.
          if [ -d node_modules ] && [ ! -L node_modules ]; then
            rm -rf node_modules.deploy-backup
            mv node_modules node_modules.deploy-backup
          fi

          # .htaccess is intentionally excluded from the package so cPanel Passenger
          # configuration remains managed by the server environment.
          unzip -o "$ARCHIVE" -x "node_modules/*" ".htaccess"
          rm -f "$ARCHIVE"

          source "$VENV/bin/activate"
          node -v
          npm -v
          npm install --omit=dev

          rm -rf node_modules.deploy-backup
          mkdir -p tmp
          touch tmp/restart.txt
          REMOTE
