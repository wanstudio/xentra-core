name: Deploy Xentra Core to xentra.cloud (VPS)

on:
  push:
    branches:
      - main

concurrency:
  group: xentra-vps-deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to VPS via git pull
        env:
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          ssh -i ~/.ssh/vps_deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          APP="/home/$USER/xentra-core"

          echo "=== [1/5] Git pull ==="
          cd "$APP"
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

          echo "=== [2/5] Install dependencies ==="
          source ~/.nvm/nvm.sh
          nvm use 24
          node -v
          npm -v
          npm install --omit=dev 2>&1

          echo "=== [3/5] Verify .env exists ==="
          if [ ! -f .env ]; then
            echo "ERROR: .env file not found at $APP/.env"
            echo "Create it first! See docs/DEPLOYMENT.md"
            exit 1
          fi

          echo "=== [4/5] Restart app with PM2 ==="
          pm2 restart xentra-core --update-env || pm2 start server/app.js --name xentra-core
          pm2 save

          echo "=== [5/5] Verify app is running ==="
          sleep 3
          pm2 status
          curl -sf http://127.0.0.1:3000/health || {
            echo "ERROR: Health check failed!"
            pm2 logs xentra-core --lines 20
            exit 1
          }

          echo ""
          echo "=== Deploy successful! ==="
          REMOTE

      - name: Deploy complete
        run: echo "Deployed to xentra.cloud successfully"
