name: Build Mybangjo POS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/pos-android/**'
      - '.github/workflows/build-pos-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android POS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: native/pos-android
        run: chmod +x gradlew

      - name: Build Signed Release APK
        working-directory: native/pos-android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp native/pos-android/app/build/outputs/apk/release/app-release.apk build-output/mybangjo-pos.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mybangjo-pos-apk
          path: build-output/mybangjo-pos.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: pos-v1.1.4
          name: "Mybangjo POS App v1.1.4"
          make_latest: false
          body: |
            ### Mybangjo POS App v1.1.4 (Official Proportional Floating Icon with POS Brand Blue Accent)
            - Download langsung file `mybangjo-pos.apk` di bawah tanpa ekstrak ZIP.
            - **Pembaruan v1.1.4**:
              - **Floating Icon Beraksen Biru Khas POS**: Desain bola melayang diselaraskan 100% dengan formula Merchant (Dark Slate `#0f172a` dengan aksen Royal Blue khas POS `#2563eb`, icon bulat `ic_launcher_round` proporsional dengan padding 7dp). Tampilan sangat proporsional, elegan, dan identik dengan warna brand POS.
              - **Floating Assistive Ball (Bola Melayang 24/7)**: Bola pintar kasir dengan logo resmi POS, menampilkan counter pesanan baru, dan membuka kasir saat diklik.
              - **Top Bar / Status Bar HP Dinamis Adaptif**: Mengikuti warna halaman aktif.
              - **Background Order Monitor & Sirene Audio**: Memantau pesanan masuk secara real-time.
              - **Direct Thermal Bluetooth Printing & Auto Cash Drawer Kick**.
          files: build-output/mybangjo-pos.apk

