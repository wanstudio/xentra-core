name: Build Mybangjo POS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/pos-android/**'
      - '.github/workflows/build-pos-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android POS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: native/pos-android
        run: chmod +x gradlew

      - name: Build Signed Release APK
        working-directory: native/pos-android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp native/pos-android/app/build/outputs/apk/release/app-release.apk build-output/mybangjo-pos.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mybangjo-pos-apk
          path: build-output/mybangjo-pos.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: pos-v1.0.0
          name: "Mybangjo POS App v1.0.0"
          make_latest: false
          body: |
            ### Mybangjo POS App v1.0.0 (Dedicated Cashier & POS Shell)
            - Download langsung file `mybangjo-pos.apk` di bawah tanpa ekstrak ZIP.
            - **Fitur Utama Mybangjo POS v1.0.0**:
              - **Environment Mandiri Kasir**: Terisolasi khusus untuk operasional kasir toko/cabang (`com.mybangjo.pos`).
              - **Screen Always On (Kiosk Mode)**: Layar tablet/HP kasir tetap menyala selama jam operasional kasir.
              - **Direct Thermal Bluetooth Printing**: Cetak struk kasir otomatis (silent print ESC/POS) langsung ke printer bluetooth kasir.
              - **Auto Cash Drawer Kick**: Pemicu otomatis pembuka laci uang kasir (RJ11) saat transaksi tunai selesai.
              - **Adaptive Status Bar**: Status bar bersih putih menyatu dengan UI kasir.
          files: build-output/mybangjo-pos.apk
