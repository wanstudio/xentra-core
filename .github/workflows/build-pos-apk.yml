name: Build Mybangjo POS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/pos-android/**'
      - '.github/workflows/build-pos-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android POS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: native/pos-android
        run: chmod +x gradlew

      - name: Build Signed Release APK
        working-directory: native/pos-android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp native/pos-android/app/build/outputs/apk/release/app-release.apk build-output/mybangjo-pos.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mybangjo-pos-apk
          path: build-output/mybangjo-pos.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: pos-v1.1.0
          name: "Mybangjo POS App v1.1.0"
          make_latest: false
          body: |
            ### Mybangjo POS App v1.1.0 (Full Parity Native POS Shell)
            - Download langsung file `mybangjo-pos.apk` di bawah tanpa ekstrak ZIP.
            - **Fitur Baru & Paritas Lengkap v1.1.0**:
              - **Floating Assistive Ball (Bola Melayang 24/7)**: Bola pintar kasir tetap aktif di layar Android saat membuka aplikasi lain, menampilkan badge counter pesanan baru, dan sekali ketuk langsung membuka kasir.
              - **Top Bar / Status Bar HP Dinamis Adaptif**: Warna status bar Android (jam, baterai, sinyal) otomatis berubah mengikuti tema dan background halaman kasir yang sedang aktif.
              - **Background Order Monitor & Sirene Audio**: Memantau pesanan masuk secara real-time di latar belakang lengkap dengan nada panggil suara kasir dan notifikasi popup kartu order.
              - **Direct Thermal Bluetooth Printing**: Cetak struk kasir otomatis (silent print ESC/POS) langsung ke printer bluetooth.
              - **Auto Cash Drawer Kick**: Pemicu otomatis pembuka laci kasir (RJ11) saat pembayaran tunai selesai.
              - **Screen Always On (Kiosk Mode)**: Layar tablet/HP kasir tetap terjaga menyala selama jam operasional shift kasir.
          files: build-output/mybangjo-pos.apk

