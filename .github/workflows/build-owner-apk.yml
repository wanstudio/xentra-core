name: Build Mybangjo Owner APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/owner-android/**'
      - '.github/workflows/build-owner-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Owner APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: native/owner-android
        run: chmod +x gradlew

      - name: Build Signed Release APK
        working-directory: native/owner-android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp native/owner-android/app/build/outputs/apk/release/app-release.apk build-output/mybangjo-owner.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mybangjo-owner-apk
          path: build-output/mybangjo-owner.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: owner-v1.0.1
          name: "Mybangjo Owner App v1.0.1"
          make_latest: false
          body: |
            ### Mybangjo Owner App v1.0.1 (Native Google Sign-In & Account Picker Parity)
            - Download langsung file `mybangjo-owner.apk` di bawah tanpa ekstrak ZIP.
            - **Pembaruan Penting v1.0.1**:
              - **Native Google Sign-In (1-Tap Account Picker Bottom Sheet)**: Tombol "Continue with Google" kini langsung memunculkan bottom sheet daftar akun Google bawaan sistem HP ("Pilih akun Google") layaknya Gojek/Grab/Tokopedia via Google Play Services auth.
              - **Seamless Token Synchronization**: ID Token terverifikasi langsung ditransfer ke backend dan otomatis masuk ke sesi Owner.
              - **Aplikasi Mobile Khusus Owner**: Terpisah bersih dari dashboard desktop. Menggunakan Bottom Navigation (5 Tab: Beranda, Bisnis, Pesanan, Keuangan, Lainnya).
              - **Ikon Resmi Owner**: Menggunakan logo resmi Owner (Slate Metal) yang di-upload dari dashboard.
              - **Floating Assistive Ball 24/7**: Bola melayang pintar beraksen Slate Metal `#64748b` untuk memantau pesanan masuk secara real-time.
              - **Status Bar Putih Adaptif**: Mengikuti warna header halaman aplikasi secara otomatis.
              - **Order & Alert Monitor**: Memantau operasional seluruh cabang secara live.
          files: build-output/mybangjo-owner.apk
