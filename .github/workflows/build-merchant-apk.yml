name: Build Mybangjo Merchant APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/merchant-android/**'
      - '.github/workflows/build-merchant-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: native/merchant-android
        run: chmod +x gradlew

      - name: Build Signed Release APK
        working-directory: native/merchant-android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp native/merchant-android/app/build/outputs/apk/release/app-release.apk build-output/mybangjo-merchant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mybangjo-merchant-apk
          path: build-output/mybangjo-merchant.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: merchant-app-latest
          name: "Mybangjo Merchant App Latest (v1.2.1)"
          body: |
            ### Mybangjo Merchant App v1.2.1 (Signed Release)
            - Download langsung file `mybangjo-merchant.apk` di bawah tanpa ekstrak ZIP.
            - **Catatan Pemasangan**: Jika sebelumnya sudah pernah menginstal Mybangjo Merchant di HP, **uninstall (copot pemasangan) aplikasi lama terlebih dahulu** agar tidak muncul pesan "Aplikasi tidak terinstal" akibat perbedaan tanda tangan paket sebelumnya.
          files: build-output/mybangjo-merchant.apk

