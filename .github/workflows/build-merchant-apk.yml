name: Build Mybangjo Merchant APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/merchant-android/**'
      - '.github/workflows/build-merchant-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: native/merchant-android
        run: chmod +x gradlew

      - name: Build Signed Release APK
        working-directory: native/merchant-android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp native/merchant-android/app/build/outputs/apk/release/app-release.apk build-output/mybangjo-merchant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mybangjo-merchant-apk
          path: build-output/mybangjo-merchant.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.6
          name: "Mybangjo Merchant App v1.2.6"
          make_latest: true
          body: |
            ### Mybangjo Merchant App v1.2.6 (Signed Release)
            - Download langsung file `mybangjo-merchant.apk` di bawah tanpa ekstrak ZIP.
            - **Pembaruan Penting v1.2.6**:
              - **Notifikasi Android Hening (Tanpa Suara Bawaan)**: Notifikasi status bar Android dibuat 100% senyap tanpa nada dering "ding/ting" bawaan HP. Suara hanya berasal dari suara sirene aplikasi (`ada_pesanan_baru`) sehingga tidak tumpang tindih.
              - **Fix Floating Icon Duplikat (1 Bola Pasti)**: Inisialisasi ganda dan race condition WindowManager diperbaiki total. Hanya ada tepat 1 bola melayang di layar.
              - **Kartu Pop-up Melayang Bersih**: 1 kartu orderan melayang dengan tombol besar `[Buka Kasir]` dan `[Tutup]`.
              - **Bebas Reload Liar**: Gesture swipe-to-refresh dinonaktifkan.
              - **Offline-First Smart Cache**: Rangka UI instan tanpa blank putih.
              - **Catatan Pemasangan**: Copot pemasangan (uninstall) versi lama terlebih dahulu sebelum memasang versi baru agar cache channel notifikasi Android ter-reset bersih.
          files: build-output/mybangjo-merchant.apk

