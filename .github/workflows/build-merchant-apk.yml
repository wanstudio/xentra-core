name: Build Mybangjo Merchant APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/merchant-android/**'
      - '.github/workflows/build-merchant-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: native/merchant-android
        run: chmod +x gradlew

      - name: Build Signed Release APK
        working-directory: native/merchant-android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp native/merchant-android/app/build/outputs/apk/release/app-release.apk build-output/mybangjo-merchant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mybangjo-merchant-apk
          path: build-output/mybangjo-merchant.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: merchant-v1.3.0
          name: "Mybangjo Merchant App v1.3.0"
          make_latest: false
          body: |
            ### Mybangjo Merchant App v1.3.0 (Native Google Sign-In & Account Picker Parity)
            - Download langsung file `mybangjo-merchant.apk` di bawah tanpa ekstrak ZIP.
            - **Pembaruan Penting v1.3.0**:
              - **Native Google Sign-In (1-Tap Account Picker Bottom Sheet)**: Tombol "Continue with Google" kini langsung memunculkan bottom sheet daftar akun Google bawaan sistem HP ("Pilih akun Google") layaknya Gojek/Grab/Tokopedia via Google Play Services auth.
              - **Seamless Token Synchronization**: ID Token terverifikasi langsung ditransfer ke backend dan otomatis masuk ke sesi merchant.
              - **Ikon Resmi Merchant Sesuai Upload Owner**: Ikon aplikasi di homescreen dan bola melayang (floating overlay) menggunakan logo Merchant resmi yang di-upload dari dashboard Owner.
              - **Status Bar Putih Adaptif (Seamless Full White Header - GoBiz Parity)**: Area status bar HP (jam, sinyal, baterai) otomatis berubah putih menyatu dengan top bar aplikasi.
              - **Floating Icon 100% Konsisten (Self-Healing 24/7)**: Bola melayang dijamin selalu aktif di layar dan otomatis pulih kembali jika sempat tertutup.
              - **Notifikasi Android Hening (Tanpa Suara Bawaan)**: Notifikasi status bar sistem dibuat 100% senyap tanpa nada dering "ding/ting" bawaan HP. Suara hanya berasal dari suara sirene aplikasi (`ada_pesanan_baru`).
              - **Catatan Pemasangan**: Copot pemasangan (uninstall) versi lama terlebih dahulu sebelum memasang versi baru jika diperlukan.
          files: build-output/mybangjo-merchant.apk

