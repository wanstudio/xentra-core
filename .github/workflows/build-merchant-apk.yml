name: Build Mybangjo Merchant APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/merchant-android/**'
      - '.github/workflows/build-merchant-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: native/merchant-android
        run: chmod +x gradlew

      - name: Build Signed Release APK
        working-directory: native/merchant-android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p build-output
          cp native/merchant-android/app/build/outputs/apk/release/app-release.apk build-output/mybangjo-merchant.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mybangjo-merchant-apk
          path: build-output/mybangjo-merchant.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.8
          name: "Mybangjo Merchant App v1.2.8"
          make_latest: true
          body: |
            ### Mybangjo Merchant App v1.2.8 (Signed Release)
            - Download langsung file `mybangjo-merchant.apk` di bawah tanpa ekstrak ZIP.
            - **Pembaruan Penting v1.2.8**:
              - **Status Bar Putih Adaptif (Seamless Full White Header - GoBiz Parity)**: Area status bar HP (jam, sinyal, baterai) kini otomatis berubah putih menyatu dengan top bar aplikasi, dengan ikon jam/baterai hitam kontras yang elegan.
              - **Floating Icon 100% Konsisten (Self-Healing 24/7)**: Bola melayang dijamin selalu aktif di layar dan otomatis pulih kembali jika sempat tertutup.
              - **Notifikasi Android Hening (Tanpa Suara Bawaan)**: Notifikasi status bar sistem dibuat 100% senyap tanpa nada dering "ding/ting" bawaan HP. Suara hanya berasal dari suara sirene aplikasi (`ada_pesanan_baru`).
              - **Optimasi Play Protect**: Menghapus izin berisiko tinggi sehingga ramah Google Play Protect.
              - **Catatan Pemasangan**: Copot pemasangan (uninstall) versi lama terlebih dahulu sebelum memasang versi baru agar cache sistem dan channel notifikasi ter-reset bersih.
          files: build-output/mybangjo-merchant.apk

