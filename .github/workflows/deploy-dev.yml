name: Auto Deploy Xentra Core to configurable target

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Xentra Core
        run: |
          zip -r xentra-core-deploy.zip . -x "node_modules/*" ".git/*" "tmp/*"

      - name: Deploy to dev.mybangjo.com
        run: |
          curl -fsS -X POST \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary "@xentra-core-deploy.zip" \
            "${{ secrets.XENTRA_DEPLOY_URL }}/wp-json/xentra/v1/deploy-raw?target=core"
