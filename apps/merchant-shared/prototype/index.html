<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Xentra Merchant — Prototype</title>
<style>
:root{
  --ink:#111827; --ink-2:#374151; --muted:#6b7280; --muted-2:#9ca3af;
  --line:#eef0f3; --chip:#f4f5f7; --bg:#ffffff; --bg-2:#f7f8fa;
  --accent:#b6ff00; --accent-ink:#16210a;
  --green:#0f9d58; --green-soft:#eaf7ef;
  --amber:#b45309; --amber-soft:#fff7e8;
  --red:#dc2626; --red-soft:#fef2f2;
  --blue:#2563eb; --blue-soft:#eff5ff;
  --r:14px; --r-lg:18px; --r-pill:999px;
  --sh:0 1px 2px rgba(17,24,39,.04), 0 4px 14px rgba(17,24,39,.05);
  --tab:60px;
  --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg-2);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;text-align:left}
svg{display:block}
.app{max-width:460px;margin:0 auto;min-height:100%;background:var(--bg);box-shadow:0 0 0 1px var(--line)}

/* ── top bar ───────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px}
.search{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.search .q{flex:1;min-width:0;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:var(--chip);color:var(--ink-2)}
.round.accent{background:var(--accent);color:var(--accent-ink)}
.status-row{display:flex;align-items:center;gap:12px;margin-top:10px}
.status{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 10px;border-radius:var(--r-pill);
  background:var(--red-soft);color:var(--red);font-size:12.5px;font-weight:800}
.status.open{background:var(--green-soft);color:var(--green)}
.status .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.status-row .grow{flex:1}
.badge{position:relative}
.badge .n{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;border-radius:var(--r-pill);
  background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}

/* ── screen ────────────────────────────────────────────── */
.screen{padding:14px 14px calc(var(--tab) + 22px)}
.sec{margin-bottom:20px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-title{font-size:14px;font-weight:800;letter-spacing:-.1px}
.sec-link{font-size:12.5px;font-weight:700;color:var(--green);white-space:nowrap}
.fresh{font-size:11.5px;color:var(--muted);margin:-6px 0 10px;line-height:1.45}

.c{background:var(--bg);border-radius:var(--r);box-shadow:var(--sh)}
.money-hero{padding:16px 14px 14px}
.money-label{font-size:12px;font-weight:700;color:var(--muted)}
.money-value{font-size:28px;font-weight:900;letter-spacing:-1px;margin-top:4px;display:flex;align-items:center;gap:8px}
.money-value .eye{color:var(--muted-2)}
.money-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.mc{padding:12px;border-radius:var(--r);background:var(--bg-2)}
.mc .k{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.mc .v{font-size:16px;font-weight:900;letter-spacing:-.4px;margin-top:6px}
.mc .t{font-size:11px;color:var(--muted);margin-top:3px}

.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{padding:12px 10px;border-radius:var(--r);background:var(--bg);box-shadow:var(--sh)}
.metric .k{font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.3;min-height:26px}
.metric .v{font-size:19px;font-weight:900;letter-spacing:-.6px;margin-top:2px}
.metric .d{font-size:10.5px;font-weight:700;color:var(--green);margin-top:6px}
.calm{margin-top:10px;padding:12px 14px;border-radius:var(--r);background:var(--bg-2);font-size:12px;color:var(--muted);line-height:1.5}

.alert{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);margin-bottom:8px;background:var(--red-soft)}
.alert .ic{width:34px;height:34px;border-radius:11px;background:#fff;color:var(--red);display:grid;place-items:center;flex:0 0 auto}
.alert .t{font-size:13.5px;font-weight:800}
.alert .s{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.alert.warn{background:var(--amber-soft)} .alert.warn .ic{color:var(--amber)}
.alert .chev{margin-left:auto;color:var(--muted-2)}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.score{padding:14px;border-radius:var(--r);background:var(--bg);box-shadow:var(--sh)}
.score .k{font-size:12px;font-weight:700;color:var(--muted)}
.score .row{display:flex;align-items:center;gap:8px;margin-top:8px}
.score .v{font-size:19px;font-weight:900;letter-spacing:-.5px}
.score .sub{font-size:11px;color:var(--muted-2);font-weight:700}
.ring{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900}
.ring.red{background:var(--red-soft);color:var(--red)} .ring.amber{background:var(--amber-soft);color:var(--amber)}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px}
.feat{display:flex;flex-direction:column;align-items:center;gap:7px;position:relative}
.feat .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--bg);box-shadow:var(--sh);color:var(--ink-2)}
.feat .l{font-size:10.5px;font-weight:700;text-align:center;line-height:1.25;color:var(--ink-2)}
.feat .n{position:absolute;top:-2px;right:calc(50% - 29px);min-width:16px;height:16px;padding:0 4px;border-radius:var(--r-pill);
  background:var(--red);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.tag{font-size:9px;font-weight:800;color:var(--blue);background:var(--blue-soft);padding:1px 5px;border-radius:var(--r-pill)}

.strip{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r);background:#111827;color:#fff}
.strip .t{font-size:12.5px;font-weight:700;line-height:1.35}

.row{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--bg);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:8px}
.thumb{width:46px;height:46px;border-radius:12px;background:var(--bg-2);color:var(--muted-2);display:grid;place-items:center;flex:0 0 auto}
.row .g{flex:1;min-width:0}
.row .t{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.off .t,.off .s{color:var(--muted-2)}
.sw{width:44px;height:26px;border-radius:var(--r-pill);background:#dfe3e8;position:relative;flex:0 0 auto;transition:background .18s}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.sw.on{background:var(--green)} .sw.on i{transform:translateX(18px)}

.seg{display:flex;gap:4px;background:var(--chip);border-radius:var(--r-pill);padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:var(--r-pill);font-size:12.5px;font-weight:800;color:var(--muted);text-align:center}
.seg button.active{background:var(--bg);color:var(--ink);box-shadow:var(--sh)}

.order{background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--sh);padding:14px;margin-bottom:10px}
.order.new{box-shadow:0 0 0 2px var(--accent), var(--sh)}
.o-head{display:flex;align-items:flex-start;gap:10px}
.o-code{font-size:14px;font-weight:900;letter-spacing:-.2px}
.o-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px}
.o-meta .m{font-size:11.5px;color:var(--muted)}
.pill{font-size:10px;font-weight:800;padding:3px 8px;border-radius:var(--r-pill)}
.pill.new{background:var(--accent);color:var(--accent-ink)}
.pill.process{background:var(--blue-soft);color:var(--blue)}
.pill.done{background:var(--green-soft);color:var(--green)}
.pill.mute{background:var(--chip);color:var(--muted)}
.pill.reject{background:var(--red-soft);color:var(--red)}
.cd{margin-left:auto;text-align:right}
.cd .v{font-size:20px;font-weight:900;letter-spacing:-.6px;font-variant-numeric:tabular-nums;color:var(--amber)}
.cd .v.crit{color:var(--red)}
.cd .l{font-size:10px;font-weight:700;color:var(--muted-2)}
.o-items{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.o-line{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--ink-2);padding:2.5px 0}
.o-line b{color:var(--ink);font-weight:700}
.o-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.o-total{font-size:15px;font-weight:900;letter-spacing:-.3px}
.btns{display:flex;gap:8px}
.btn{padding:11px 18px;border-radius:var(--r-pill);font-size:12.5px;font-weight:800;text-align:center}
.btn.accept{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 10px rgba(182,255,0,.4)}
.btn.reject{background:var(--red-soft);color:var(--red)}
.btn.ghost{background:var(--chip);color:var(--ink-2)}
.btn.dark{background:var(--ink);color:#fff}
.btn.wide{width:100%}

.tables{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbl{padding:14px;border-radius:var(--r);background:var(--bg);box-shadow:var(--sh)}
.tbl .n{font-size:14px;font-weight:900}
.tbl .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.tbl .st{margin-top:10px}
.dotst{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800}
.dotst::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.dotst.free{color:var(--green)} .dotst.busy{color:var(--red)} .dotst.book{color:var(--amber)}

.li{display:flex;align-items:center;gap:12px;padding:14px;background:var(--bg);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:8px}
.li .g{flex:1;min-width:0}
.li .t{font-size:13.5px;font-weight:800}
.li .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.li .chev{color:var(--muted-2)}

.empty{padding:30px 16px;text-align:center}
.empty .e{font-size:28px;margin-bottom:8px}
.empty .t{font-size:13.5px;font-weight:800}
.empty .s{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.55}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:460px;margin:0 auto;
  height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted-2);
  font-size:10px;font-weight:800;padding-top:7px;position:relative}
.tab.active{color:var(--ink)}
.tab .n{position:absolute;top:4px;right:calc(50% - 21px);min-width:17px;height:17px;padding:0 4px;border-radius:var(--r-pill);
  background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}

.sw-wrap{position:fixed;inset:0;z-index:60;display:none}
.sw-wrap.open{display:block}
.sw-bg{position:absolute;inset:0;background:rgba(17,24,39,.4)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;background:#fff;
  border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-height:86%;overflow:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(12px);opacity:.7}to{transform:none;opacity:1}}
.grip{width:36px;height:4px;border-radius:99px;background:#e5e7eb;margin:6px auto 14px}
.sheet h3{margin:0 0 4px;font-size:16.5px;font-weight:900;letter-spacing:-.2px}
.sheet .m{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv:last-of-type{border-bottom:0}
.kv .k{color:var(--muted)} .kv .v{font-weight:800;text-align:right}
.acts{display:flex;gap:8px;margin-top:16px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + 18px);z-index:70;background:var(--ink);
  color:#fff;font-size:12.5px;font-weight:700;padding:11px 18px;border-radius:var(--r-pill);box-shadow:0 8px 24px rgba(17,24,39,.25);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.proto{margin:0 0 14px;font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-soft);border-radius:10px;padding:8px 11px;line-height:1.45}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
        <div class="q" id="branchQ">Bangjo Barat</div>
      </div>
      <button class="round accent" aria-label="Menu cepat" onclick="openAllFeatures()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>
      </button>
    </div>
    <div class="status-row">
      <button class="status open" id="statusChip" onclick="openStatus()">
        <span class="dot"></span><span id="statusLabel">Buka</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <span class="grow"></span>
      <button class="badge round" aria-label="Pemberitahuan" onclick="toast('2 pemberitahuan operasional')">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="n" id="notifN">2</span>
      </button>
      <button class="round" aria-label="Profil" onclick="toast('Profil cabang')">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      </button>
    </div>
  </header>

  <main class="screen" id="screen"></main>
  <nav class="tabbar" id="tabbar"></nav>

  <div class="sw-wrap" id="sheetWrap">
    <div class="sw-bg" onclick="closeSheet()"></div>
    <div class="sheet" id="sheet"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════

   no fetch, no storage, no server, no database. Reload resets everything.
   Scope: Branch Manager DAILY operations. Owner/Platform surfaces excluded.

  ],
  hours:{ open:'08:00', close:'22:00', exception:null }

const I = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
  bell:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',

  pan:'<path d="M6 9a6 6 0 0 1 12 0v10H6V9Z"/><path d="M9 5V3M15 5V3"/>',
  bike:'<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17 10 8h5l3 9"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.4-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.7 1.4l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4Z"/>',
  star:'<path d="m12 3 2.6 5.6 6 .8-4.4 4.2 1.1 6L12 16.8 6.7 19.6l1.1-6L3.4 9.4l6-.8L12 3Z"/>',
  eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  eyeoff:'<path d="M3 3l18 18"/><path d="M10.6 5.2A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3 3.6"/><path d="M6.2 6.6A17 17 0 0 0 2 12s4 7 10 7a9.7 9.7 0 0 0 4.3-1"/>',
  chev:'<path d="m9 6 6 6-6 6"/>', check:'<path d="m5 13 4 4L19 7"/>',
  alert:'<path d="M12 3 2 20h20L12 3Z"/><path d="M12 9v5M12 17h.01"/>'
};
const svg = (n,s,w) => '<svg width="'+(s||22)+'" height="'+(s||22)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
  'stroke-width="'+(w||1.9)+'" stroke-linecap="round" stroke-linejoin="round">'+I[n]+'</svg>';
const rp = n => 'Rp' + Number(n||0).toLocaleString('id-ID');
const find = (a,id) => a.find(x => x.id === id);
const mmss = s => String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')+':'+String(Math.floor(Math.max(0,s)%60)).padStart(2,'0');
const newOrders = () => S.orders.filter(o => o.status === 'new');
const lowStock  = () => S.stock.filter(s => s.qty < s.min);
const soldOut   = () => S.menu.filter(m => !m.on);

/* five daily, non-overlapping Branch-Manager surfaces */
const TABS = [
  { id:'beranda', label:'Beranda',     icon:'home'  },
  { id:'pesanan', label:'Pesanan',     icon:'bell'  },
  { id:'katalog', label:'Stok & Menu', icon:'box'   },
  { id:'promo',   label:'Promo',       icon:'promo' },
  { id:'meja',    label:'Meja',        icon:'table' }
];
let tab = 'beranda', catMode = 'menu', orderFilter = 'new', moneyHidden = false;

function badgeFor(id){
  if (id === 'pesanan') return newOrders().length;
  if (id === 'katalog') return soldOut().length + lowStock().length;
  if (id === 'meja')    return S.tables.filter(t => t.st === 'free').length;
  return 0;
}
function render(){
  const chip = document.getElementById('statusChip');
  chip.className = 'status' + (S.branch.isOpen ? ' open' : '');
  document.getElementById('statusLabel').textContent = S.branch.isOpen ? 'Buka' : 'Tutup';
  document.getElementById('branchQ').textContent = S.branch.name;
  const n = newOrders().length + lowStock().length;
  const nn = document.getElementById('notifN');
  nn.textContent = n; nn.style.display = n ? 'grid' : 'none';

  const views = { beranda:vBeranda, pesanan:vPesanan, katalog:vKatalog, promo:vPromo, meja:vMeja };
  document.getElementById('screen').innerHTML = views[tab]();

  document.getElementById('tabbar').innerHTML = TABS.map(t => {
    const b = badgeFor(t.id);
    return '<button class="tab '+(tab===t.id?'active':'')+'" onclick="go(\''+t.id+'\')">'+
      (b ? '<span class="n">'+b+'</span>' : '') + svg(t.icon,21) + '<span>'+t.label+'</span></button>';
  }).join('');
}
function go(id){ tab = id; window.scrollTo(0,0); render(); }
function toast(m){
  const e = document.getElementById('toast'); e.textContent = m; e.classList.add('show');
  clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), 1700);
}
function openSheet(h){
  document.getElementById('sheet').innerHTML = '<div class="grip"></div>' + h;
  document.getElementById('sheetWrap').classList.add('open');
}
function closeSheet(){ document.getElementById('sheetWrap').classList.remove('open'); }

/* ── Beranda: one ordered column, no repeated blocks ───────────────────── */
function vBeranda(){
  const n = newOrders().length, low = lowStock().length, out = soldOut().length;
  return [
    n ? '<div class="alert"><div class="ic">'+svg('bell',18)+'</div><div>'+
        '<div class="t">'+n+' pesanan menunggu diterima</div>'+
        '<div class="s">Terima atau tolak sebelum batas waktu berakhir.</div></div>'+
        '<button class="chev" onclick="go(\'pesanan\')">'+svg('chev',18,2.4)+'</button></div>' : '',

    '<div class="sec"><div class="c money-hero">'+
      '<div class="sec-head" style="margin-bottom:0"><div class="sec-title">Penjualan hari ini</div>'+
        '<button class="sec-link" onclick="openReport()">Rincian ›</button></div>'+
      '<div class="money-value"><span id="moneyVal">'+rp(S.today.revenue)+'</span>'+
        '<button class="eye" id="eyeBtn" onclick="toggleMoney()">'+svg('eye',19)+'</button></div>'+
      '<div class="money-cards">'+
        '<div class="mc"><div class="k">'+svg('box',14,2.2)+' Tunai (COD)</div><div class="v">'+rp(S.today.cash)+'</div>'+
          '<div class="t">18 transaksi ›</div></div>'+
        '<div class="mc"><div class="k">'+svg('chart',14,2.2)+' Online</div><div class="v">'+rp(S.today.online)+'</div>'+
          '<div class="t">63 transaksi ›</div></div>'+
      '</div>'+
    '</div></div>',

    '<div class="sec"><div class="strip"><div>'+svg('chart',18,2.2)+'</div>'+
      '<div class="t">Baru! Pantau performa cabangmu di sini</div></div></div>',

    '<div class="sec">'+
      '<div class="sec-head"><div class="sec-title">Perkembangan hari ini</div>'+
        '<button class="sec-link" onclick="toast(\'Panduan performa cabang\')">Pelajari</button></div>'+
      '<div class="fresh">Diperbarui baru saja</div>'+
      '<div class="metrics">'+
        metric('Pesanan masuk', S.today.orders)+
        metric('Pesanan selesai', S.today.done)+
        metric('Rata-rata', rp(S.today.avg))+
      '</div>'+
      (!S.today.orders ? '<div class="calm">Data akan muncul setelah ada aktivitas hari ini. Semangat!</div>' : '')+
    '</div>',

    '<div class="sec"><div class="pair">'+
      '<button class="score" onclick="openReadiness()"><div class="k">Kesiapan cabang</div>'+
        '<div class="row"><span class="ring '+(out ? 'red' : 'amber')+'">'+readiness()+'</span>'+
        '<span class="v">'+readiness()+'<span class="sub">/100</span></span>'+
        '<span style="margin-left:auto">'+svg('chev',16,2.6)+'</span></div></button>'+
      '<button class="score" onclick="toast(\'Ulasan pelanggan cabang\')"><div class="k">Rating & ulasan</div>'+
        '<div class="row"><span style="color:#f59e0b">'+svg('star',22,2)+'</span>'+
        '<span class="v">4.7</span><span style="margin-left:auto">'+svg('chev',16,2.6)+'</span></div></button>'+
    '</div></div>',

    '<div class="sec">'+
      '<div class="sec-head"><div class="sec-title">Fitur cabang</div>'+
        '<button class="sec-link" onclick="openAllFeatures()">Lihat semua</button></div>'+
      '<div class="grid">'+FEATURES.slice(0,8).map(f =>
        '<button class="feat" onclick="'+f.act+'">'+(f.n ? '<span class="n">'+f.n+'</span>' : '')+
          '<span class="ic">'+svg(f.icon,21)+'</span><span class="l">'+f.label+'</span>'+
          (f.tag ? '<span class="tag">'+f.tag+'</span>' : '')+'</button>').join('')+'</div>'+
    '</div>',

    '<div class="sec">'+
      '<div class="sec-head"><div class="sec-title">Promo cabang</div>'+
        '<button class="sec-link" onclick="go(\'promo\')">Kelola</button></div>'+
      (S.promos.filter(p => p.on).length
        ? S.promos.filter(p => p.on).map(p =>
            '<div class="li"><div class="thumb">'+svg('promo',20)+'</div>'+
            '<div class="g"><div class="t">'+p.name+'</div><div class="s">'+p.detail+'</div></div>'+
            '<span class="pill done">Aktif</span></div>').join('')
        : '<div class="calm">Belum ada promo aktif. Promo yang disetujui Owner muncul di tab Promo.</div>')+
    '</div>'
  ].join('');
}
function metric(k,v){
  return '<button class="metric" onclick="toast(\'Detail '+k+'\')"><div class="k">'+k+'</div>'+
    '<div class="v">'+v+'</div><div class="d">Detail ›</div></button>';
}
function readiness(){
  let s = 100;
  s -= soldOut().length * 12;
  s -= lowStock().length * 7;
  if (!S.branch.online) s -= 15;
  if (!S.branch.isOpen) s -= 30;
  return Math.max(35, Math.round(s));
}
const FEATURES = [
  { label:'Jam Buka',    icon:'clock', act:'openHours()' },
  { label:'Karyawan',    icon:'users', act:'openStaff()' },
  { label:'Laporan',     icon:'chart', act:'openReport()' },
  { label:'Kitchen',     icon:'pan',   act:'openKitchen()', tag:'Pantau' },
  { label:'Pengiriman',  icon:'bike',  act:'openShip()',    tag:'Pantau' },
  { label:'Pengaturan',  icon:'gear',  act:'openSettings()' }
];
function toggleMoney(){
  moneyHidden = !moneyHidden;
  document.getElementById('moneyVal').textContent = moneyHidden ? 'Rp••••••' : rp(S.today.revenue);
  document.getElementById('eyeBtn').innerHTML = svg(moneyHidden ? 'eyeoff' : 'eye', 19);
}

/* ── Pesanan ───────────────────────────────────────────────────────────── */
function vPesanan(){
  const segs = [['new','Baru'],['process','Diproses'],['done','Selesai'],['all','Semua']];
  const list = S.orders.filter(o => orderFilter === 'all' ? true : o.status === orderFilter);
  return '<div class="seg">'+segs.map(([k,l]) => {
      const c = k === 'all' ? S.orders.length : S.orders.filter(o => o.status === k).length;
      return '<button class="'+(orderFilter===k?'active':'')+'" onclick="setFilter(\''+k+'\')">'+l+(k!=='all'&&c?' · '+c:'')+'</button>';
    }).join('')+'</div>'+
    (list.length ? list.map(oCard).join('')
      : '<div class="empty"><div class="e">🧾</div><div class="t">Belum ada pesanan di sini</div>'+
        '<div class="s">Pesanan baru muncul otomatis beserta hitungan waktu penerimaannya.</div></div>');
}
function setFilter(f){ orderFilter = f; render(); }
function oCard(o){
  const st = { new:['new','BARU'], process:['process','DIPROSES'], done:['done','SELESAI'], reject:['reject','DITOLAK'] }[o.status];
  const ty = { delivery:'Delivery', pickup:'Pickup', 'dine-in':'Dine-in' }[o.type];
  return '<div class="order '+(o.status==='new'?'new':'')+'">'+
    '<div class="o-head"><div style="min-width:0">'+
      '<div class="o-code">'+o.code+'</div>'+
      '<div class="o-meta"><span class="pill '+st[0]+'">'+st[1]+'</span><span class="pill mute">'+ty+'</span>'+
        '<span class="m">· '+o.time+' · '+o.cust+'</span></div></div>'+
    (o.left != null ? '<div class="cd"><div class="v'+(o.left<60?' crit':'')+'" id="cd-'+o.id+'">'+mmss(o.left)+'</div>'+
      '<div class="l">sisa waktu</div></div>' : '')+
    '</div>'+
    '<div class="o-items">'+o.items.map(([n,q,t]) => '<div class="o-line"><span>'+q+'× '+n+'</span><b>'+rp(t*q)+'</b></div>').join('')+'</div>'+
    '<div class="o-foot"><div class="o-total">'+rp(o.total)+'</div><div class="btns">'+
      (o.status === 'new'
        ? '<button class="btn reject" onclick="setOrder(\''+o.id+'\',\'reject\')">Tolak</button>'+
          '<button class="btn accept" onclick="setOrder(\''+o.id+'\',\'process\')">Terima</button>'
        : '<button class="btn ghost" onclick="openOrder(\''+o.id+'\')">Detail</button>'+
          (o.status === 'process' ? '<button class="btn dark" onclick="setOrder(\''+o.id+'\',\'done\')">Selesaikan</button>' : ''))+
    '</div></div></div>';
}
function setOrder(id, to){
  const o = find(S.orders,id); if (!o) return;
  o.status = to; if (to !== 'new') o.left = null;
  if (to === 'process') S.today.done = Math.min(S.today.orders, S.today.done + 1);
  toast(to === 'process' ? o.code+' diterima' : to === 'reject' ? o.code+' ditolak' : o.code+' selesai');
  if (orderFilter === 'new' && to !== 'new') orderFilter = 'process';
  render();
}
function openOrder(id){
  const o = find(S.orders,id); if (!o) return;
  openSheet('<h3>Pesanan '+o.code+'</h3><div class="m">'+o.cust+' · '+o.time+'</div>'+
    o.items.map(([n,q,t]) => '<div class="kv"><span class="k">'+q+'× '+n+'</span><span class="v">'+rp(t*q)+'</span></div>').join('')+
    '<div class="kv"><span class="k">Total</span><span class="v">'+rp(o.total)+'</span></div>');
}

/* ── Stok & Menu: one tab, two modes ───────────────────────────────────── */
function vKatalog(){
  return '<div class="seg">'+
      '<button class="'+(catMode==='menu'?'active':'')+'" onclick="catMode=\'menu\';render()">Menu</button>'+
      '<button class="'+(catMode==='stok'?'active':'')+'" onclick="catMode=\'stok\';render()">Stok</button>'+
    '</div>' + (catMode === 'menu' ? vMenu() : vStok());
}
function vMenu(){
  return (soldOut().length ? '<div class="alert warn"><div class="ic">'+svg('menu',18)+'</div><div>'+
      '<div class="t">'+soldOut().length+' menu ditandai habis</div>'+
      '<div class="s">Pelanggan tidak bisa memesan menu ini sampai diaktifkan kembali.</div></div></div>' : '')+
    S.menu.map(m =>
      '<div class="row '+(m.on?'':'off')+'"><div class="thumb">'+svg('menu',20)+'</div>'+
      '<div class="g"><div class="t">'+m.name+'</div><div class="s">'+rp(m.price)+' · '+m.cat+' · terjual '+m.sold+'</div></div>'+
      '<button class="sw '+(m.on?'on':'')+'" role="switch" aria-checked="'+m.on+'" aria-label="'+m.name+'" '+
        'onclick="toggleMenu(\''+m.id+'\')"><i></i></button></div>').join('')+
    '<button class="btn dark wide" style="margin-top:6px" onclick="toast(\'Tambah menu dari katalog Owner\')">Tambah menu dari katalog</button>';
}
function toggleMenu(id){
  const m = find(S.menu,id); if (!m) return;
  m.on = !m.on; toast(m.name + (m.on ? ' diaktifkan' : ' ditandai habis')); render();
}
function vStok(){
  const low = lowStock();
  return (low.length
      ? '<div class="alert"><div class="ic">'+svg('alert',18)+'</div><div>'+
        '<div class="t">'+low.length+' bahan di bawah minimum</div>'+
        '<div class="s">'+low.map(s => s.name+' ('+s.qty+' '+s.unit+')').join(', ')+'</div></div></div>'
      : '<div class="alert warn" style="background:var(--green-soft)"><div class="ic" style="color:var(--green)">'+
        svg('check',18)+'</div><div><div class="t">Stok cabang aman</div>'+
        '<div class="s">Semua bahan di atas batas minimum.</div></div></div>')+
    S.stock.map(s => {
      const isLow = s.qty < s.min;
      return '<div class="row"><div class="thumb">'+svg('box',20)+'</div>'+
        '<div class="g"><div class="t">'+s.name+'</div><div class="s">min. '+s.min+' '+s.unit+'</div></div>'+
        '<div style="text-align:right"><div style="font-size:15px;font-weight:900;'+(isLow?'color:var(--red)':'')+'">'+
          s.qty+' <span style="font-size:11px;font-weight:700">'+s.unit+'</span></div>'+
          '<span class="pill '+(isLow?'reject':'done')+'" style="margin-top:4px;display:inline-block">'+
          (isLow?'Menipis':'Aman')+'</span></div>'+
        '<button class="btn ghost" style="padding:9px 13px" onclick="adjustStock(\''+s.id+'\')">Ubah</button></div>';
    }).join('');
}
function adjustStock(id){
  const s = find(S.stock,id); if (!s) return;
  openSheet('<h3>'+s.name+'</h3><div class="m">Catat pemakaian harian cabang.</div>'+
    '<div class="kv"><span class="k">Stok saat ini</span><span class="v">'+s.qty+' '+s.unit+'</span></div>'+
    '<div class="kv"><span class="k">Batas minimum</span><span class="v">'+s.min+' '+s.unit+'</span></div>'+
    '<div class="acts"><button class="btn ghost wide" onclick="bump(\''+s.id+'\',-1)">− 1 '+s.unit+'</button>'+
    '<button class="btn accept wide" onclick="bump(\''+s.id+'\',1)">+ 1 '+s.unit+'</button></div>');
}
function bump(id,d){
  const s = find(S.stock,id); if (!s) return;
  s.qty = Math.max(0, s.qty + d);
  toast(s.name+' → '+s.qty+' '+s.unit); closeSheet(); render();
}

/* ── Promo ─────────────────────────────────────────────────────────────── */
function vPromo(){
  return '<div class="sec-head"><div class="sec-title">Promo cabang</div></div>'+
    '<div class="fresh">Cabang hanya mengaktifkan atau menonaktifkan promo yang sudah disetujui Owner — bukan membuat promo baru.</div>'+
    S.promos.map(p =>
      '<div class="li"><div class="thumb">'+svg('promo',20)+'</div>'+
      '<div class="g"><div class="t">'+p.name+'</div><div class="s">'+p.detail+'</div></div>'+
      '<button class="sw '+(p.on?'on':'')+'" role="switch" aria-checked="'+p.on+'" aria-label="'+p.name+'" '+
        'onclick="togglePromo(\''+p.id+'\')"><i></i></button></div>').join('');
}
function togglePromo(id){
  const p = find(S.promos,id); if (!p) return;
  p.on = !p.on; toast(p.name + (p.on ? ' diaktifkan' : ' dinonaktifkan')); render();
}

/* ── Meja ──────────────────────────────────────────────────────────────── */
const TLBL = { free:'Tersedia', busy:'Terisi', book:'Dipesan' };
function vMeja(){
  return '<div class="sec-head"><div class="sec-title">Status meja hari ini</div>'+
    '<button class="sec-link" onclick="toast(\'Ketuk kartu meja untuk mengubah status\')">Bantuan</button></div>'+
    '<div class="fresh">Denah dan jumlah kursi ditetapkan Owner. Di sini cabang hanya mengubah status harian.</div>'+
    '<div class="tables">'+S.tables.map(t =>
      '<button class="tbl" onclick="cycleTable(\''+t.id+'\')"><div class="n">'+t.name+'</div>'+
      '<div class="s">'+t.seats+' kursi</div><div class="st"><span class="dotst '+t.st+'">'+TLBL[t.st]+'</span></div></button>').join('')+
    '</div>';
}
function cycleTable(id){
  const t = find(S.tables,id); if (!t) return;
  t.st = t.st === 'free' ? 'busy' : t.st === 'busy' ? 'book' : 'free';
  toast(t.name+' → '+TLBL[t.st]); render();
}

/* ── sheets ────────────────────────────────────────────────────────────── */
function openAllFeatures(){
  openSheet('<h3>Semua fitur cabang</h3><div class="m">Kemampuan operasional harian Branch Manager. '+
    'Konfigurasi durable dan lintas cabang dikelola Owner.</div>'+
    FEATURES.concat([{ label:'Pengaturan cabang', icon:'gear', act:'openSettings()' }]).map(f =>
      '<div class="li" onclick="closeSheet();'+f.act+'" style="box-shadow:none;border-radius:0;padding:12px 0;border-bottom:1px solid var(--line);margin:0">'+
      '<div class="thumb">'+svg(f.icon,20)+'</div><div class="g"><div class="t">'+f.label+'</div>'+
      (f.tag ? '<div class="s">'+f.tag+'</div>' : '')+'</div><span class="chev">'+svg('chev',16,2.4)+'</span></div>').join(''));
}
function openStatus(){
  openSheet('<h3>Status cabang</h3><div class="m">Buka/tutup menentukan apakah pesanan baru diterima.</div>'+
    '<div class="kv"><span class="k">Cabang</span><span class="v">'+(S.branch.isOpen?'Buka':'Tutup')+'</span></div>'+
    '<div class="kv"><span class="k">Order online</span><span class="v">'+(S.branch.online?'Aktif':'Dijeda')+'</span></div>'+
    '<div class="acts"><button class="btn ghost wide" onclick="flip(\'online\')">'+
      (S.branch.online?'Jeda online':'Aktifkan online')+'</button>'+
    '<button class="btn accept wide" onclick="flip(\'isOpen\')">'+
      (S.branch.isOpen?'Tutup cabang':'Buka cabang')+'</button></div>');
}
function flip(k){
  S.branch[k] = !S.branch[k];
  toast(k === 'isOpen' ? (S.branch.isOpen?'Cabang dibuka':'Cabang ditutup')
                       : (S.branch.online?'Order online aktif':'Order online dijeda'));
  closeSheet(); render();
}
function openReadiness(){
  openSheet('<h3>Kesiapan cabang</h3><div class="m">Skor dari kondisi operasional saat ini.</div>'+
    '<div class="kv"><span class="k">Menu ditandai habis</span><span class="v">'+soldOut().length+'</span></div>'+
    '<div class="kv"><span class="k">Bahan di bawah minimum</span><span class="v">'+lowStock().length+'</span></div>'+
    '<div class="kv"><span class="k">Status cabang</span><span class="v">'+(S.branch.isOpen?'Buka':'Tutup')+'</span></div>'+
    '<div class="kv"><span class="k">Order online</span><span class="v">'+(S.branch.online?'Aktif':'Dijeda')+'</span></div>');
}
function openHours(){
  openSheet('<h3>Jam buka</h3><div class="m">Owner menetapkan jadwal default. Cabang hanya mencatat pengecualian harian.</div>'+
    '<div class="kv"><span class="k">Jadwal default</span><span class="v">'+S.hours.open+' – '+S.hours.close+'</span></div>'+
    '<div class="kv"><span class="k">Pengecualian hari ini</span><span class="v">'+(S.hours.exception||'Tidak ada')+'</span></div>'+
    '<div class="acts"><button class="btn dark wide" onclick="toast(\'Catat pengecualian jadwal\')">Catat pengecualian</button></div>');
}
function openStaff(){
  openSheet('<h3>Karyawan cabang</h3><div class="m">Staf operasional cabang ini beserta shift hariannya.</div>'+
    S.staff.map(u => '<div class="kv"><span class="k">'+u.name+
      '<br><span style="font-size:11px">'+u.role+' · shift '+u.shift+'</span></span>'+
      '<span class="v"><span class="pill '+(u.on?'done':'mute')+'">'+(u.on?'Aktif':'Nonaktif')+'</span></span></div>').join(''));
}
function openReport(){
  openSheet('<h3>Laporan harian</h3><div class="m">Ringkasan operasional cabang hari ini.</div>'+
    '<div class="kv"><span class="k">Penjualan</span><span class="v">'+rp(S.today.revenue)+'</span></div>'+
    '<div class="kv"><span class="k">Pesanan masuk</span><span class="v">'+S.today.orders+'</span></div>'+
    '<div class="kv"><span class="k">Pesanan selesai</span><span class="v">'+S.today.done+'</span></div>'+
    '<div class="kv"><span class="k">Rata-rata per pesanan</span><span class="v">'+rp(S.today.avg)+'</span></div>'+
    '<div class="kv"><span class="k">Menunggu diterima</span><span class="v">'+newOrders().length+'</span></div>');
}
function openKitchen(){
  openSheet('<h3>Dapur — pantau</h3><div class="m">Progres masak bersifat pantauan. Aksinya ada di perangkat dapur.</div>'+
    '<div class="kv"><span class="k">Sedang dimasak</span><span class="v">3</span></div>'+
    '<div class="kv"><span class="k">Siap diantar</span><span class="v">2</span></div>'+
    '<div class="kv"><span class="k">Rata-rata waktu masak</span><span class="v">11 mnt</span></div>');
}
function openShip(){
  openSheet('<h3>Pengiriman — pantau</h3><div class="m">Status kurir bersifat pantauan; penetapan kurir bukan wewenang cabang.</div>'+
    '<div class="kv"><span class="k">Dalam pengantaran</span><span class="v">4</span></div>'+
    '<div class="kv"><span class="k">Menunggu kurir</span><span class="v">1</span></div>'+
    '<div class="kv"><span class="k">Selesai hari ini</span><span class="v">'+S.today.done+'</span></div>');
}
function openSettings(){
  openSheet('<h3>Pengaturan cabang</h3><div class="m">Profil, jam default, dan konfigurasi durable lain ditetapkan Owner. '+
    'Cabang mengatur operasional harian.</div>'+
    '<div class="kv"><span class="k">Nama cabang</span><span class="v">'+S.branch.name+'</span></div>'+
    '<div class="kv"><span class="k">Order online</span><span class="v">'+(S.branch.online?'Aktif':'Dijeda')+'</span></div>'+
    '<div class="kv"><span class="k">Meja terdaftar</span><span class="v">'+S.tables.length+'</span></div>');
}

/* ── boot ──────────────────────────────────────────────────────────────── */
render();
/* visual countdown only — never mutates order status */
setInterval(function(){
  if (tab !== 'pesanan') return;
  S.orders.forEach(o => {
    if (o.status !== 'new' || o.left == null) return;
    o.left = Math.max(0, o.left - 1);
    const el = document.getElementById('cd-' + o.id);
    if (el){ el.textContent = mmss(o.left); el.className = 'v' + (o.left < 60 ? ' crit' : ''); }
  });
}, 1000);
</script>
