<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="color-scheme" content="light dark">
<title>Xentra Merchant — Prototype</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   Design tokens — light + dark in one place (prefers-color-scheme).
   Neutral surfaces, one brand accent, soft depth. No borders on cards.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --ink:#0b1220; --ink-2:#334155; --muted:#64748b; --muted-2:#94a3b8;
  --bg:#f4f6f9; --surface:#fff; --surface-2:#f1f3f7; --line:#e8ecf2;
  --accent:#b6ff00; --accent-ink:#132007;
  --brand:#0b1220; --on-brand:#fff;
  --ok:#0e9f6e; --ok-bg:#e7f8f0;
  --warn:#c2760a; --warn-bg:#fff4e2;
  --danger:#e11d48; --danger-bg:#feeaef;
  --info:#2f6fed; --info-bg:#eaf1ff;
  --r-xs:10px; --r-sm:13px; --r:18px; --r-lg:24px;
  --sh:0 1px 2px rgba(11,18,32,.04), 0 10px 26px -14px rgba(11,18,32,.18);
  --sh-lift:0 2px 6px rgba(11,18,32,.06), 0 18px 40px -18px rgba(11,18,32,.28);
  --tab:66px;
  --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#eef2f8; --ink-2:#c8d3e2; --muted:#93a1b8; --muted-2:#64748b;
    --bg:#080e18; --surface:#111a28; --surface-2:#18243a; --line:#243148;
    --brand:#eef2f8; --on-brand:#0b1220;
    --ok-bg:#0f2a22; --warn-bg:#2b2109; --danger-bg:#2c0f18; --info-bg:#0f1c33;
    --sh:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -14px rgba(0,0,0,.7);
    --sh-lift:0 2px 8px rgba(0,0,0,.5), 0 20px 44px -20px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
svg{display:block}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.app{max-width:440px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;
  box-shadow:0 0 0 1px var(--line)}

/* ── header ────────────────────────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:40;padding:14px 18px 12px;background:var(--bg);
  backdrop-filter:saturate(180%) blur(14px)}
.top-row{display:flex;align-items:center;gap:12px}
.brand-mark{width:40px;height:40px;border-radius:13px;flex:0 0 auto;
  box-shadow:0 6px 16px -6px rgba(11,18,32,.55)}
.hello{flex:1;min-width:0}
.hello .h{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.2px}
.hello .b{font-size:16.5px;font-weight:800;letter-spacing:-.3px;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  background:var(--surface);color:var(--ink-2);box-shadow:var(--sh);position:relative;
  transition:transform .12s ease}
.ico:active{transform:scale(.94)}
.ico .n{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;
  background:var(--danger);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;
  box-shadow:0 0 0 2px var(--bg)}

.statusbar{display:flex;align-items:center;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px 7px 10px;border-radius:99px;
  font-size:12px;font-weight:800;background:var(--surface);box-shadow:var(--sh)}
.chip .d{width:7px;height:7px;border-radius:50%;background:var(--muted-2)}
.chip.on .d{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.chip.off .d{background:var(--danger);box-shadow:0 0 0 3px var(--danger-bg)}
.chip.ghost{background:transparent;box-shadow:none;color:var(--muted);padding:7px 8px}
.seg-inline{display:flex;gap:6px;margin-left:auto;background:var(--surface-2);padding:4px;border-radius:99px}
.seg-inline button{padding:6px 12px;border-radius:99px;font-size:11.5px;font-weight:800;color:var(--muted)}
.seg-inline button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}

/* ── screen ────────────────────────────────────────────────────────────── */
.screen{padding:6px 18px calc(var(--tab) + 26px)}
.sec{margin:0 0 22px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-t{font-size:15px;font-weight:800;letter-spacing:-.2px}
.sec-a{font-size:12.5px;font-weight:800;color:var(--muted);display:inline-flex;align-items:center;gap:3px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh)}

/* attention */
.att{display:flex;align-items:center;gap:13px;padding:14px;border-radius:var(--r);margin-bottom:10px;
  background:var(--warn-bg);transition:transform .12s ease}
.att:active{transform:scale(.985)}
.att.danger{background:var(--danger-bg)} .att.info{background:var(--info-bg)}
.att.calm{background:var(--ok-bg)}
.att .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--surface);color:var(--warn)}
.att.danger .ic{color:var(--danger)} .att.calm .ic{color:var(--ok)}
.att .t{font-size:13.5px;font-weight:800;letter-spacing:-.1px}
.att .s{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.att .go{margin-left:auto;color:var(--muted-2)}

/* money hero */
.hero{padding:18px;border-radius:var(--r-lg);background:var(--brand);color:var(--on-brand);
  box-shadow:var(--sh-lift);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:190px;height:190px;
  border-radius:50%;background:var(--accent);opacity:.16;filter:blur(6px)}
.hero .k{font-size:11.5px;font-weight:800;opacity:.72;letter-spacing:.4px;text-transform:uppercase}
.hero .row{display:flex;align-items:flex-end;gap:10px;margin-top:8px}
.hero .v{font-size:31px;font-weight:900;letter-spacing:-1.2px}
.hero .eye{opacity:.75;margin-bottom:5px}
.hero .delta{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;
  padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.14);margin-bottom:6px}
.hero .split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;position:relative;z-index:1}
.hero .sp{padding:11px 12px;border-radius:var(--r-xs);background:rgba(255,255,255,.10)}
.hero .sp .l{font-size:10.5px;font-weight:800;opacity:.75;letter-spacing:.3px}
.hero .sp .n{font-size:14.5px;font-weight:900;margin-top:5px}
.hero .sp .c{font-size:10.5px;opacity:.65;margin-top:3px}
.spark{margin-top:14px;position:relative;z-index:1;opacity:.9}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{padding:13px;border-radius:var(--r);background:var(--surface);box-shadow:var(--sh)}
.kpi .k{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
.kpi .v{font-size:19px;font-weight:900;margin-top:6px}
.kpi .d{font-size:10.5px;font-weight:800;color:var(--ok);margin-top:5px;display:flex;align-items:center;gap:3px}

/* activity feed */
.feed{display:flex;gap:12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--surface);
  box-shadow:var(--sh);margin-bottom:8px}
.feed .dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--surface-2);color:var(--muted)}
.feed .t{font-size:13px;font-weight:700}
.feed .s{font-size:11px;color:var(--muted-2);margin-top:2px}

/* ── orders ────────────────────────────────────────────────────────────── */
.tabs{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:99px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 6px;border-radius:99px;font-size:12.5px;font-weight:800;
  color:var(--muted);text-align:center}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}

.order{padding:15px;border-radius:var(--r);background:var(--surface);box-shadow:var(--sh);margin-bottom:11px}
.order.hot{box-shadow:0 0 0 2px var(--accent), var(--sh-lift)}
.o-top{display:flex;align-items:flex-start;gap:12px}
.o-id{font-size:14.5px;font-weight:900;letter-spacing:-.2px}
.o-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:10px;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.hot{background:var(--accent);color:var(--accent-ink)}
.o-time{font-size:11.5px;color:var(--muted)}
.cd{margin-left:auto;text-align:right;flex:0 0 auto}
.cd .v{font-size:19px;font-weight:900;color:var(--warn)}
.cd .v.crit{color:var(--danger)}
.cd .l{font-size:9.5px;font-weight:800;color:var(--muted-2);letter-spacing:.3px;text-transform:uppercase}

/* lifecycle stepper — mirrors the locked authority order */
.steps{display:flex;align-items:center;gap:0;margin:14px 0 0}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.step .bar{position:absolute;top:6px;left:50%;right:-50%;height:2px;background:var(--surface-2)}
.step:last-child .bar{display:none}
.step .pt{width:13px;height:13px;border-radius:50%;background:var(--surface-2);
  box-shadow:0 0 0 3px var(--surface);position:relative;z-index:1}
.step.done .pt,.step.done .bar{background:var(--ok)}
.step.now .pt{background:var(--accent);box-shadow:0 0 0 3px var(--surface),0 0 0 6px rgba(182,255,0,.28)}
.step .lb{font-size:9px;font-weight:800;color:var(--muted-2);letter-spacing:.2px;white-space:nowrap}
.step.done .lb{color:var(--muted)} .step.now .lb{color:var(--ink)}

.o-items{margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.o-line{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--ink-2);padding:3px 0}
.o-line b{color:var(--ink);font-weight:800}
.o-note{margin-top:9px;padding:8px 11px;border-radius:var(--r-xs);background:var(--warn-bg);
  color:var(--warn);font-size:11.5px;font-weight:700}
.o-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px}
.o-total{font-size:16px;font-weight:900}
.acts{display:flex;gap:8px}
.btn{padding:11px 17px;border-radius:99px;font-size:12.5px;font-weight:800;text-align:center;
  transition:transform .12s ease}
.btn:active{transform:scale(.96)}
.btn.go{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px -6px rgba(182,255,0,.7)}
.btn.dark{background:var(--brand);color:var(--on-brand)}
.btn.soft{background:var(--surface-2);color:var(--ink-2)}
.btn.danger{background:var(--danger-bg);color:var(--danger)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45}

/* ── lists ─────────────────────────────────────────────────────────────── */
.searchbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:99px;
  background:var(--surface);box-shadow:var(--sh);color:var(--muted);margin-bottom:12px}
.searchbar input{flex:1;border:0;outline:0;background:none;font-size:13.5px;font-family:inherit;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;padding:9px 15px;border-radius:99px;font-size:12.5px;font-weight:800;
  background:var(--surface);color:var(--muted);box-shadow:var(--sh)}
.chips button.on{background:var(--brand);color:var(--on-brand)}

.li{display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:var(--r);
  background:var(--surface);box-shadow:var(--sh);margin-bottom:9px}
.thumb{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--surface-2);color:var(--muted-2)}
.li .g{flex:1;min-width:0}
.li .t{font-size:13.5px;font-weight:800;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.li.gone .t,.li.gone .s{color:var(--muted-2)}
.val{font-size:15px;font-weight:900}
.val.low{color:var(--danger)}
.sw{width:46px;height:28px;border-radius:99px;background:var(--surface-2);position:relative;flex:0 0 auto;
  transition:background .2s ease;box-shadow:inset 0 0 0 1px var(--line)}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);
  box-shadow:0 2px 6px rgba(11,18,32,.22);transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:var(--accent);box-shadow:none}
.sw.on i{transform:translateX(18px)}

/* ── hub ───────────────────────────────────────────────────────────────── */
.profile{padding:16px;border-radius:var(--r-lg);background:var(--brand);color:var(--on-brand);
  box-shadow:var(--sh-lift);display:flex;align-items:center;gap:14px;margin-bottom:20px}
.profile .av{width:48px;height:48px;border-radius:16px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-weight:900;font-size:18px;flex:0 0 auto}
.profile .n{font-size:15px;font-weight:800}
.profile .r{font-size:11.5px;opacity:.7;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{padding:13px 6px;border-radius:var(--r);background:var(--surface);box-shadow:var(--sh);
  display:flex;flex-direction:column;align-items:center;gap:9px;transition:transform .12s ease}
.tile:active{transform:scale(.95)}
.tile .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
  background:var(--surface-2);color:var(--ink-2)}
.tile .l{font-size:10px;font-weight:800;text-align:center;line-height:1.25;color:var(--ink-2)}
.tile .n{position:absolute}

/* ── sheets & feedback ─────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:60;display:none;background:rgba(8,14,24,.5);
  backdrop-filter:blur(3px)}
.scrim.open{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:440px;margin:0 auto;background:var(--surface);
  border-radius:var(--r-lg) var(--r-lg) 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));
  max-height:88%;overflow:auto;box-shadow:var(--sh-lift);
  animation:rise .26s cubic-bezier(.2,.9,.25,1)}
@keyframes rise{from{transform:translateY(22px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 16px}
.sheet h3{margin:0 0 5px;font-size:17.5px;font-weight:900;letter-spacing:-.3px}
.sheet .sub{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:16px}
.kv{display:flex;justify-content:space-between;gap:14px;font-size:13px;padding:12px 0;border-bottom:1px solid var(--line)}
.kv:last-of-type{border-bottom:0}
.kv .k{color:var(--muted)} .kv .v{font-weight:800;text-align:right}
.sheet-acts{display:flex;gap:9px;margin-top:18px}

.skel{border-radius:var(--r);background:linear-gradient(100deg,var(--surface-2) 30%,var(--surface) 50%,var(--surface-2) 70%);
  background-size:220% 100%;animation:shim 1.25s infinite linear;height:92px;margin-bottom:11px}
@keyframes shim{from{background-position:180% 0}to{background-position:-40% 0}}

.empty{padding:36px 20px;text-align:center}
.empty .e{width:58px;height:58px;border-radius:20px;margin:0 auto 14px;display:grid;place-items:center;
  background:var(--surface);box-shadow:var(--sh);color:var(--muted-2)}
.empty .t{font-size:14px;font-weight:800}
.empty .s{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.55}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:440px;margin:0 auto;
  height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--muted-2);font-size:9.5px;font-weight:800;padding-top:8px;position:relative}
.tab.on{color:var(--ink)}
.tab .pin{position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--accent);
  opacity:0;transition:opacity .18s ease}
.tab.on .pin{opacity:1}
.tab .n{position:absolute;top:5px;right:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;
  background:var(--danger);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;
  box-shadow:0 0 0 2px var(--surface)}

.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 22px);transform:translate(-50%,8px);z-index:70;
  background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:800;padding:12px 20px;border-radius:99px;
  box-shadow:var(--sh-lift);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.note{margin-bottom:16px;padding:11px 14px;border-radius:var(--r-sm);background:var(--info-bg);
  color:var(--info);font-size:11px;font-weight:700;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-label="Xentra">
        <defs><linearGradient id="xgrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#d4ff5c"/><stop offset="1" stop-color="#9be600"/>
        </linearGradient></defs>
        <rect width="40" height="40" rx="13" fill="url(#xgrad)"/>
        <path d="M13 13l14 14M27 13L13 27" stroke="#0b1220" stroke-width="3.6" stroke-linecap="round"/>
      </svg>
      <div class="hello">
        <div class="h" id="greet">Selamat pagi</div>
        <div class="b" id="branchName">Bangjo Barat</div>
      </div>
      <button class="ico" aria-label="Notifikasi" onclick="toast('2 pemberitahuan')">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="n" id="bellN">2</span>
      </button>
    </div>
    <div class="statusbar">
      <button class="chip" id="stChip" onclick="openStatus()">
        <span class="d"></span><span id="stText">Buka</span>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="seg-inline" id="modeSeg">
        <button class="on" onclick="setMode('live')">Live</button>
        <button onclick="setMode('shift')">Shift</button>
      </div>
    </div>
  </header>

  <main class="screen" id="screen"></main>
  <nav class="tabbar" id="tabbar"></nav>

  <div class="scrim" id="scrim" onclick="closeSheet()"><div class="sheet" id="sheet" onclick="event.stopPropagation()"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   XENTRA MERCHANT — UI PROTOTYPE (in-memory dummy only).
   No fetch, no storage, no server, no database. Reload resets everything.

   Locked direction honoured here:
   • Merchant App is the Branch Manager operational centre, and in the MVP the
     Branch Manager also runs the cooking stages when the outlet has no
     dedicated kitchen surface (KDS is an optional future SaaS add-on, and is
     deliberately absent from navigation).
   • Authority: BM accept/reject + cooking stages + dispatch; Driver completes
     delivery; POS handles settlement. Core remains the single authority.
   ══════════════════════════════════════════════════════════════════════════ */
const S = {
  branch:{ name:'Bangjo Barat', city:'Surabaya', isOpen:true, online:true, rating:4.7 },
  today:{ revenue:4850000, orders:87, done:81, avg:55700, delta:12,
          cash:1240000, online:3610000, trend:[4,6,5,8,7,10,9,12,11,14,13,16] },
  orders:[

/* ── Pesanan: the MVP operating flow lives here ──────────────────────────
   Aksi per tahap (branch manager, MVP):
     pending    → Terima / Tolak
     confirmed  → Mulai masak        (dimasak)
     preparing  → Tandai siap        (siap diantar)
     ready      → Kirim / Selesaikan (dispatch)
     out_for_delivery → selesai oleh Driver                             */
const FLOW = [
  { key:'pending',    label:'Diterima' },
  { key:'confirmed',  label:'Dimasak'  },
  { key:'preparing',  label:'Dimasak'  },
  { key:'ready',      label:'Siap'     },
  { key:'out_for_delivery', label:'Diantar' }
];
function stageOf(status){
  if (status === 'pending') return 0;
  if (status === 'confirmed') return 1;
  if (status === 'preparing') return 2;
  if (status === 'ready') return 3;
  if (status === 'out_for_delivery') return 4;
  return 5;
}
function vPesanan(){
  const groups = { aktif:['pending','confirmed','preparing','ready'], baru:['pending'], proses:['confirmed','preparing','ready'], selesai:['completed','cancelled','rejected','timeout'] };
  const list = S.orders.filter(o => groups[orderTab].indexOf(o.status) !== -1);
  const tabs = [['aktif','Aktif'],['baru','Baru'],['proses','Diproses'],['selesai','Selesai']];
  return '<div class="tabs">'+tabs.map(([k,l]) => {
      const c = S.orders.filter(o => groups[k].indexOf(o.status) !== -1).length;
      return '<button class="'+(orderTab===k?'on':'')+'" onclick="setTab(\''+k+'\')">'+l+(c?' · '+c:'')+'</button>';
    }).join('')+'</div>'+
    (list.length ? list.map(oCard).join('')
      : '<div class="empty"><span class="e">'+svg('order',26)+'</span><div class="t">Belum ada pesanan</div>'+
        '<div class="s">Pesanan baru muncul di sini beserta hitungan waktu penerimaannya.</div></div>');
}
function setTab(k){ orderTab = k; render(); }
function oCard(o){
  const st = stageOf(o.status);
  const steps = FLOW.map((f,i) => {
    const cls = i < st ? 'done' : i === st ? 'now' : '';
    return '<div class="step '+cls+'"><span class="bar"></span><span class="pt"></span>'+
      '<span class="lb">'+(i===2?'':f.label)+'</span></div>';
  }).join('');
  const tags = { delivery:'Delivery', pickup:'Pickup', 'dine-in':'Dine-in' };
  const statusTag = o.status === 'pending' ? '<span class="tag hot">BARU</span>'
    : o.status === 'preparing' ? '<span class="tag warn">DIMASAK</span>'
    : o.status === 'ready' ? '<span class="tag ok">SIAP</span>'
    : '<span class="tag info">DITERIMA</span>';
  const act = actionFor(o);
  return '<div class="order '+(o.status==='pending'?'hot':'')+'">'+
    '<div class="o-top"><div style="min-width:0">'+
      '<div class="o-id">'+o.code+'</div>'+
      '<div class="o-meta">'+statusTag+'<span class="tag">'+tags[o.type]+'</span>'+
        '<span class="o-time">'+o.mins+' mnt · '+o.cust+'</span></div>'+
    '</div>'+
    (o.left != null ? '<div class="cd"><div class="v num'+(o.left<60?' crit':'')+'" id="cd-'+o.id+'">'+mmss(o.left)+'</div>'+
      '<div class="l">sisa waktu</div></div>' : '')+
    '</div>'+
    (o.status === 'completed' ? '' : '<div class="steps">'+steps+'</div>')+
    '<div class="o-items">'+o.items.map(([n,q,t]) =>
      '<div class="o-line"><span>'+q+'× '+n+'</span><b class="num">'+rp(t*q)+'</b></div>').join('')+
      (o.note ? '<div class="o-note">Catatan: '+o.note+'</div>' : '')+
    '</div>'+
    '<div class="o-foot"><div class="o-total num">'+rp(o.total)+'</div><div class="acts">'+act+'</div></div>'+
  '</div>';
}
function actionFor(o){
  const detail = '<button class="btn soft" onclick="openOrder(\''+o.id+'\')">Detail</button>';
  if (o.status === 'pending')    return '<button class="btn danger" onclick="advance(\''+o.id+'\',\'reject\')">Tolak</button>'+
                                        '<button class="btn go" onclick="advance(\''+o.id+'\',\'confirmed\')">Terima</button>';
  if (o.status === 'confirmed')  return detail + '<button class="btn go" onclick="advance(\''+o.id+'\',\'preparing\')">Mulai masak</button>';
  if (o.status === 'preparing')  return detail + '<button class="btn go" onclick="advance(\''+o.id+'\',\'ready\')">Tandai siap</button>';
  if (o.status === 'ready')      return detail + '<button class="btn dark" onclick="advance(\''+o.id+'\',\''+(o.type==='delivery'?'out_for_delivery':'completed')+'\')">'+
                                        (o.type === 'delivery' ? 'Kirim' : 'Selesaikan')+'</button>';
  if (o.status === 'out_for_delivery') return '<span class="tag">Diantar kurir</span>' + detail;
  return detail;
}
function advance(id, to){
  const o = find(S.orders,id); if (!o) return;
  const msg = { confirmed:'Pesanan diterima', preparing:'Mulai dimasak', ready:'Siap diantar',
                out_for_delivery:'Dikirim ke kurir', completed:'Pesanan selesai', reject:'Pesanan ditolak' }[to] || 'Diperbarui';
  o.status = to === 'reject' ? 'rejected' : to;
  if (o.status !== 'pending') o.left = null;
  if (o.status === 'completed') S.today.done = Math.min(S.today.orders, S.today.done + 1);
  toast(o.code + ' · ' + msg);
  render();
}
function openOrder(id){
  const o = find(S.orders,id); if (!o) return;
  const lbl = { pending:'Menunggu diterima', confirmed:'Diterima', preparing:'Sedang dimasak',
                ready:'Siap', out_for_delivery:'Diantar kurir', completed:'Selesai' };
  openSheet('<h3>'+o.code+'</h3><div class="sub">'+o.cust+' · '+o.mins+' menit lalu · '+(lbl[o.status]||o.status)+'</div>'+
    o.items.map(([n,q,t]) => '<div class="kv"><span class="k">'+q+'× '+n+'</span><span class="v num">'+rp(t*q)+'</span></div>').join('')+
    (o.note ? '<div class="kv"><span class="k">Catatan</span><span class="v">'+o.note+'</span></div>' : '')+
    '<div class="kv"><span class="k">Total</span><span class="v num">'+rp(o.total)+'</span></div>'+
    '<div class="sheet-acts">'+actionFor(o)+'</div>');
}

/* ── Menu ──────────────────────────────────────────────────────────────── */
function vMenu(){
  const cats = ['Semua'].concat([...new Set(S.menu.map(m => m.cat))]);
  const list = S.menu.filter(m => (menuCat==='Semua' || m.cat===menuCat) &&
    (!menuQ || m.name.toLowerCase().includes(menuQ)));
  return '<div class="searchbar">'+svg('more',17)+
      '<input id="menuQ" placeholder="Cari menu…" value="'+menuQ+'" oninput="menuQ=this.value.toLowerCase();render();var e=document.getElementById(\'menuQ\');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length);}"></div>'+
    '<div class="chips">'+cats.map(c => '<button class="'+(menuCat===c?'on':'')+'" onclick="menuCat=\''+c+'\';render()">'+c+'</button>').join('')+'</div>'+
    (soldOut().length ? '<div class="att info"><span class="ic">'+svg('menu',19)+'</span>'+
      '<span><span class="t">'+soldOut().length+' menu habis</span>'+
      '<span class="s">Pelanggan tidak bisa memesan sampai diaktifkan kembali.</span></span></div>' : '')+
    list.map(m => '<div class="li '+(m.on?'':'gone')+'"><span class="thumb">'+svg('menu',20)+'</span>'+
      '<span class="g"><span class="t">'+m.name+'</span><span class="s num">'+rp(m.price)+' · '+m.cat+
      ' · terjual '+m.sold+'</span></span>'+
      '<button class="sw '+(m.on?'on':'')+'" role="switch" aria-checked="'+m.on+'" aria-label="'+m.name+'" '+
        'onclick="toggleMenu(\''+m.id+'\')"><i></i></button></div>').join('')+
    '<button class="btn dark wide" style="margin-top:8px" onclick="toast(\'Tambah menu dari katalog Owner\')">'+
      'Tambah menu dari katalog</button>';
}
function toggleMenu(id){
  const m = find(S.menu,id); if (!m) return;
  m.on = !m.on; toast(m.name + (m.on ? ' diaktifkan' : ' ditandai habis')); render();
}

/* ── Stok ──────────────────────────────────────────────────────────────── */
function vStok(){
  const low = lowStock();
  return (low.length
    ? '<div class="att danger"><span class="ic">'+svg('alert',19)+'</span>'+
      '<span><span class="t">'+low.length+' bahan di bawah minimum</span>'+
      '<span class="s">'+low.map(s => s.name+' '+s.qty+s.unit).join(', ')+'</span></span></div>'
    : '<div class="att calm"><span class="ic">'+svg('check',19)+'</span>'+
      '<span><span class="t">Stok aman</span><span class="s">Semua bahan di atas batas minimum.</span></span></div>')+
    '<div class="sec-head" style="margin-top:16px"><span class="sec-t">Bahan & persediaan</span>'+
      '<button class="sec-a" onclick="toast(\'Riwayat pemakaian\')">Riwayat</button></div>'+
    S.stock.map(s => {
      const isLow = s.qty < s.min;
      return '<div class="li"><span class="thumb">'+svg('box',20)+'</span>'+
        '<span class="g"><span class="t">'+s.name+'</span><span class="s">min. '+s.min+' '+s.unit+'</span></span>'+
        '<span style="text-align:right"><span class="val num'+(isLow?' low':'')+'">'+s.qty+
          '<span style="font-size:11px;font-weight:800"> '+s.unit+'</span></span></span>'+
        '<button class="btn soft" style="padding:9px 14px" onclick="adjustStock(\''+s.id+'\')">Ubah</button></div>';
    }).join('');
}
function adjustStock(id){
  const s = find(S.stock,id); if (!s) return;
  openSheet('<h3>'+s.name+'</h3><div class="sub">Catat pemakaian atau penambahan harian cabang.</div>'+
    '<div class="kv"><span class="k">Stok saat ini</span><span class="v num">'+s.qty+' '+s.unit+'</span></div>'+
    '<div class="kv"><span class="k">Batas minimum</span><span class="v num">'+s.min+' '+s.unit+'</span></div>'+
    '<div class="sheet-acts"><button class="btn soft wide" onclick="bump(\''+s.id+'\',-1)">− 1 '+s.unit+'</button>'+
    '<button class="btn go wide" onclick="bump(\''+s.id+'\',1)">+ 1 '+s.unit+'</button></div>');
}
function bump(id,d){ const s = find(S.stock,id); if (!s) return;
  s.qty = Math.max(0, s.qty + d); toast(s.name+' → '+s.qty+' '+s.unit); closeSheet(); render(); }

/* ── Lainnya: the long tail lives here, grouped and once only ───────────── */
const HUB = [
  { g:'Operasional', items:[
    { l:'Meja',      i:'table', a:'openMeja()',   n:S.tables.filter(t=>t.st==='free').length },
    { l:'Promo',     i:'promo', a:'openPromo()' },
    { l:'Jam Buka',  i:'clock', a:'openHours()' } ]},
  { g:'Tim', items:[
    { l:'Karyawan',  i:'users', a:'openStaff()' },
    { l:'Shift',     i:'clock', a:'toast(\'Kelola shift harian\')' },
    { l:'Laporan',   i:'chart', a:'openReport()' } ]},
  { g:'Cabang', items:[
    { l:'Pengaturan', i:'gear', a:'openSettings()' },
    { l:'Bantuan',    i:'more', a:'toast(\'Pusat bantuan\')' } ]}
];
function vLainnya(){
  return '<div class="profile"><span class="av">B</span>'+
      '<div><div class="n">'+S.branch.name+'</div>'+
      '<div class="r">'+S.branch.city+' · ★ '+S.branch.rating.toFixed(1)+' · '+
        (S.branch.isOpen ? 'Buka' : 'Tutup')+'</div></div></div>'+
    HUB.map(sec => '<div class="sec"><div class="sec-head"><span class="sec-t">'+sec.g+'</span></div>'+
      '<div class="grid">'+sec.items.map(t => '<button class="tile" onclick="'+t.a+'">'+
        (t.n ? '<span class="n"></span>' : '') +
        '<span class="ic">'+svg(t.i,20)+'</span><span class="l">'+t.l+'</span></button>').join('')+
      '</div></div>').join('')+
    '<button class="btn soft wide" style="margin-top:4px" onclick="toast(\'Keluar dari aplikasi\')">Keluar</button>';
}

/* ── sheets ────────────────────────────────────────────────────────────── */
function openStatus(){
  openSheet('<h3>Status cabang</h3><div class="sub">Mengatur apakah pesanan baru diterima dan diproses.</div>'+
    '<div class="kv"><span class="k">Cabang</span><span class="v">'+(S.branch.isOpen?'Buka':'Tutup')+'</span></div>'+
    '<div class="kv"><span class="k">Order online</span><span class="v">'+(S.branch.online?'Aktif':'Dijeda')+'</span></div>'+
    '<div class="sheet-acts"><button class="btn soft wide" onclick="flip(\'online\')">'+
      (S.branch.online?'Jeda online':'Aktifkan online')+'</button>'+
    '<button class="btn '+(S.branch.isOpen?'danger':'go')+' wide" onclick="flip(\'open\')">'+
      (S.branch.isOpen?'Tutup cabang':'Buka cabang')+'</button></div>');
}
function flip(k){
  if (k === 'open') S.branch.isOpen = !S.branch.isOpen; else S.branch.online = !S.branch.online;
  toast(k === 'open' ? (S.branch.isOpen?'Cabang dibuka':'Cabang ditutup')
                     : (S.branch.online?'Order online aktif':'Order online dijeda'));
  closeSheet(); render();
}
function openMeja(){
  const lbl = { free:'Tersedia', busy:'Terisi', book:'Dipesan' };
  openSheet('<h3>Status meja</h3><div class="sub">Denah dan jumlah kursi ditetapkan Owner — di sini hanya status harian.</div>'+
    S.tables.map(t => '<div class="kv"><span class="k">'+t.name+' · '+t.seats+' kursi</span>'+
      '<span class="v"><span class="tag '+(t.st==='free'?'ok':t.st==='busy'?'hot':'warn')+'">'+lbl[t.st]+'</span></span></div>').join(''));
}
function openPromo(){
  openSheet('<h3>Promo cabang</h3><div class="sub">Cabang hanya mengaktifkan promo yang sudah disetujui Owner.</div>'+
    S.promos.map(p => '<div class="kv"><span class="k">'+p.name+'<br><span style="font-size:11px">'+p.detail+
      '</span></span><span class="v"><button class="sw '+(p.on?'on':'')+'" onclick="togglePromo(\''+p.id+'\')"><i></i></button></span></div>').join(''));
}
function togglePromo(id){ const p = find(S.promos,id); if (!p) return;
  p.on = !p.on; toast(p.name + (p.on ? ' diaktifkan' : ' dinonaktifkan')); openPromo(); }
function openHours(){
  openSheet('<h3>Jam buka</h3><div class="sub">Owner menetapkan jadwal default; cabang mencatat pengecualian harian.</div>'+
    '<div class="kv"><span class="k">Jadwal default</span><span class="v num">'+S.hours.open+' – '+S.hours.close+'</span></div>'+
    '<div class="kv"><span class="k">Pengecualian hari ini</span><span class="v">'+(S.hours.exception||'Tidak ada')+'</span></div>'+
    '<div class="sheet-acts"><button class="btn dark wide" onclick="toast(\'Catat pengecualian\')">Catat pengecualian</button></div>');
}
function openStaff(){
  openSheet('<h3>Karyawan cabang</h3><div class="sub">Staf operasional cabang ini dan shift hariannya.</div>'+
    S.staff.map(u => '<div class="kv"><span class="k">'+u.name+'<br><span style="font-size:11px">'+u.role+
      ' · shift '+u.shift+'</span></span><span class="v"><span class="tag '+(u.on?'ok':'')+'">'+
      (u.on?'Aktif':'Nonaktif')+'</span></span></div>').join(''));
}
function openReport(){
  openSheet('<h3>Laporan harian</h3><div class="sub">Ringkasan operasional cabang hari ini.</div>'+
    '<div class="kv"><span class="k">Penjualan</span><span class="v num">'+rp(S.today.revenue)+'</span></div>'+
    '<div class="kv"><span class="k">Pesanan masuk</span><span class="v num">'+S.today.orders+'</span></div>'+
    '<div class="kv"><span class="k">Pesanan selesai</span><span class="v num">'+S.today.done+'</span></div>'+
    '<div class="kv"><span class="k">Rata-rata per pesanan</span><span class="v num">'+rp(S.today.avg)+'</span></div>'+
    '<div class="kv"><span class="k">Menunggu diterima</span><span class="v num">'+newOrders().length+'</span></div>');
}
function openSettings(){
  openSheet('<h3>Pengaturan cabang</h3><div class="sub">Konfigurasi durable (profil, jam default, denah) ditetapkan Owner. '+
    'Cabang mengatur operasional harian.</div>'+
    '<div class="kv"><span class="k">Nama cabang</span><span class="v">'+S.branch.name+'</span></div>'+
    '<div class="kv"><span class="k">Kota</span><span class="v">'+S.branch.city+'</span></div>'+
    '<div class="kv"><span class="k">Meja terdaftar</span><span class="v num">'+S.tables.length+'</span></div>'+
    '<div class="kv"><span class="k">Order online</span><span class="v">'+(S.branch.online?'Aktif':'Dijeda')+'</span></div>');
}

/* ── boot ──────────────────────────────────────────────────────────────── */
render();
/* countdown is display-only: it never mutates order state */
setInterval(function(){
  if (tab !== 'pesanan') return;
  S.orders.forEach(o => {
    if (o.status !== 'pending' || o.left == null) return;
    o.left = Math.max(0, o.left - 1);
    const el = document.getElementById('cd-' + o.id);
    if (el){ el.textContent = mmss(o.left); el.className = 'v num' + (o.left < 60 ? ' crit' : ''); }
  });
}, 1000);
</script>
</body>
</html>
