<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Xentra Merchant — Prototype</title>
<style>
:root{
  --x-primary:#b6ff00; --x-primary-ink:#0f172a;
  --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --muted-2:#94a3b8;
  --bg:#f4f6f9; --card:#ffffff; --line:#e6ebf1; --line-2:#eef2f6;
  --ok:#16a34a; --ok-soft:#eafaf0; --warn:#f59e0b; --warn-soft:#fff7e6;
  --danger:#ef4444; --danger-soft:#fef2f2; --info:#2563eb; --info-soft:#eff5ff;
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px;
  --sh-1:0 1px 2px rgba(15,23,42,.04), 0 2px 8px rgba(15,23,42,.04);
  --sh-2:0 6px 18px rgba(15,23,42,.08);
  --appbar:56px; --tabbar:64px;
  --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
svg{display:block}

/* shelter the prototype in a phone-width column on desktop */
.shell{max-width:460px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;
  box-shadow:0 0 0 1px var(--line)}

/* ── App bar ───────────────────────────────────────────── */
.appbar{position:sticky;top:0;z-index:30;height:var(--appbar);display:flex;align-items:center;gap:10px;
  padding:0 14px;background:var(--card);border-bottom:1px solid var(--line)}
.appbar .branch{display:flex;align-items:center;gap:8px;min-width:0}
.branch-dot{width:8px;height:8px;border-radius:50%;background:var(--muted-2);flex:0 0 auto}
.branch-dot.open{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.branch-dot.closed{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.branch-name{font-size:15px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.branch-sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px}
.appbar .spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2);
  position:relative;transition:background .15s}
.icon-btn:active{background:var(--line-2)}
.icon-btn .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;
  background:var(--danger);border:2px solid var(--card)}

/* ── Screen ────────────────────────────────────────────── */
.screen{padding:14px 14px calc(var(--tabbar) + 26px)}
.section{margin:0 0 18px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
.section-title{font-size:13px;font-weight:800;color:var(--ink);letter-spacing:.2px}
.section-link{font-size:12px;font-weight:700;color:var(--muted)}

/* ── Cards ─────────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.card-pad{padding:14px}

/* status hero — the two daily switches a branch manager owns */
.hero{padding:14px;display:flex;flex-direction:column;gap:12px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hero-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.hero-value{font-size:18px;font-weight:800;margin-top:3px}
.hero-note{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-top:12px;border-top:1px dashed var(--line)}
.hero-row .t{font-size:13px;font-weight:700}
.hero-row .s{font-size:11px;color:var(--muted);margin-top:2px}

.switch{width:46px;height:27px;border-radius:999px;background:#dbe2ea;position:relative;flex:0 0 auto;
  transition:background .18s}
.switch i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(15,23,42,.25);transition:transform .18s}
.switch.on{background:var(--ok)}
.switch.on.primary{background:var(--x-primary)}
.switch.on i{transform:translateX(19px)}
.switch[aria-disabled="true"]{opacity:.5}

/* attention */
.attn{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:var(--r-md);
  background:var(--warn-soft);border:1px solid #fde9c3;margin-bottom:8px}
.attn.danger{background:var(--danger-soft);border-color:#fcdada}
.attn.info{background:var(--info-soft);border-color:#dbe8ff}
.attn .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;
  background:#fff;color:var(--warn)}
.attn.danger .ic{color:var(--danger)} .attn.info .ic{color:var(--info)}
.attn .body{flex:1;min-width:0}
.attn .t{font-size:13px;font-weight:800}
.attn .s{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.attn .go{font-size:12px;font-weight:800;color:var(--ink)}
.attn.calm{background:var(--ok-soft);border-color:#cdeeda}
.attn.calm .ic{color:var(--ok)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 10px;text-align:left}
.stat .k{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font-size:15px;font-weight:800;margin-top:5px;letter-spacing:-.3px}
.stat .d{font-size:10.5px;font-weight:700;margin-top:3px;color:var(--ok)}
.stat .d.down{color:var(--danger)}

/* quick actions */
.qa{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.qa::-webkit-scrollbar{display:none}
.qa-btn{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:700;box-shadow:var(--sh-1)}
.qa-btn:active{background:var(--line-2)}
.qa-btn.primary{background:var(--x-primary);border-color:transparent;color:var(--x-primary-ink)}

/* ── Segmented control ─────────────────────────────────── */
.seg{display:flex;gap:6px;background:var(--line-2);border-radius:999px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:8px 10px;border-radius:999px;font-size:12.5px;font-weight:800;color:var(--muted)}
.seg button.active{background:var(--card);color:var(--ink);box-shadow:var(--sh-1)}

/* ── Order card ────────────────────────────────────────── */
.order{padding:13px 14px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line);
  box-shadow:var(--sh-1);margin-bottom:10px;position:relative;overflow:hidden}
.order.new{border-color:#ffd9a8;box-shadow:0 0 0 3px var(--warn-soft)}
.order.new::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--warn)}
.order.fresh{animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--warn-soft)}50%{box-shadow:0 0 0 6px #fdeccd}}
.order-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.order-code{font-size:13.5px;font-weight:800;letter-spacing:-.2px}
.order-meta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:10.5px;
  font-weight:800;letter-spacing:.2px}
.chip.new{background:var(--warn);color:#3b2600}
.chip.wait{background:var(--warn-soft);color:#8a5a00}
.chip.process{background:var(--info-soft);color:#1d4ed8}
.chip.done{background:var(--ok-soft);color:#15803d}
.chip.reject{background:var(--danger-soft);color:#b91c1c}
.chip.tag{background:var(--line-2);color:var(--muted)}
.countdown{font-size:22px;font-weight:900;letter-spacing:-.6px;font-variant-numeric:tabular-nums;color:#b45309}
.countdown.crit{color:var(--danger)}
.order-items{margin:10px 0 0;padding:10px 0 0;border-top:1px dashed var(--line)}
.order-line{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-2);padding:3px 0}
.order-line b{font-weight:700;color:var(--ink)}
.order-foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;padding-top:11px;
  border-top:1px solid var(--line-2)}
.order-total{font-size:14px;font-weight:800}
.order-actions{display:flex;gap:8px}
.btn{padding:10px 16px;border-radius:999px;font-size:12.5px;font-weight:800;border:1px solid transparent}
.btn.ghost{background:var(--card);border-color:var(--line);color:var(--ink-2)}
.btn.reject{background:var(--danger-soft);color:#b91c1c}
.btn.accept{background:var(--x-primary);color:var(--x-primary-ink);box-shadow:0 3px 10px rgba(182,255,0,.45)}
.btn.primary{background:var(--ink);color:#fff}
.btn.block{width:100%;text-align:center}
.btn:disabled{opacity:.45;box-shadow:none}

/* ── List rows (menu / stock) ──────────────────────────── */
.search{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:10px 14px;margin-bottom:10px;color:var(--muted)}
.search input{border:0;outline:0;background:none;font-size:13px;font-family:inherit;flex:1;color:var(--ink)}
.cats{display:flex;gap:7px;overflow-x:auto;padding:0 2px 10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  font-size:12px;font-weight:700;color:var(--muted)}
.cat.active{background:var(--ink);color:#fff;border-color:var(--ink)}

.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-md);margin-bottom:8px;box-shadow:var(--sh-1)}
.thumb{width:46px;height:46px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--line-2);color:var(--muted-2);font-size:17px}
.row .grow{flex:1;min-width:0}
.row .name{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.row.off .name,.row.off .sub{color:var(--muted-2)}
.stock-qty{font-size:14px;font-weight:900;letter-spacing:-.3px}
.stock-qty.low{color:var(--danger)}
.pill{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--line-2);color:var(--muted)}
.pill.low{background:var(--danger-soft);color:#b91c1c}
.pill.ok{background:var(--ok-soft);color:#15803d}

/* ── Hub (Lainnya) ─────────────────────────────────────── */
.hub{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 6px;
  display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:var(--sh-1);position:relative}
.tile:active{background:var(--line-2)}
.tile .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--line-2);color:var(--ink)}
.tile .t{font-size:10.5px;font-weight:700;text-align:center;line-height:1.25}
.badge-mini{position:absolute;top:7px;right:7px;font-size:9px;font-weight:800;padding:2px 5px;border-radius:999px;
  background:var(--info-soft);color:#1d4ed8}

/* ── Bottom tab bar ────────────────────────────────────── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:460px;margin:0 auto;
  height:calc(var(--tabbar) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted-2);
  font-size:10px;font-weight:800;padding-top:8px;position:relative}
.tab.active{color:var(--ink)}
.tab.active::after{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--x-primary)}
.tab .n{position:absolute;top:5px;right:calc(50% - 20px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;
  background:var(--danger);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}

/* ── FAB ───────────────────────────────────────────────── */
.fab{position:fixed;right:calc(50% - 230px + 16px);bottom:calc(var(--tabbar) + 18px);z-index:41;
  height:48px;padding:0 20px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px;font-weight:800;
  display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px rgba(15,23,42,.28)}
@media (max-width:479px){.fab{right:16px}}

/* ── Sheet (detail) ────────────────────────────────────── */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:none}
.sheet-wrap.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(15,23,42,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;background:var(--card);
  border-radius:var(--r-xl) var(--r-xl) 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));
  max-height:88%;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet-grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 12px}
.sheet h3{margin:0 0 4px;font-size:16px;font-weight:800}
.sheet .muted{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.kv:last-of-type{border-bottom:0}
.kv .k{color:var(--muted)} .kv .v{font-weight:700;text-align:right}
.sheet-actions{display:flex;gap:8px;margin-top:16px}

.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty .e{font-size:30px;margin-bottom:8px}
.empty .t{font-size:13.5px;font-weight:800;color:var(--ink)}
.empty .s{font-size:12px;margin-top:4px;line-height:1.5}

.proto-note{margin:2px 2px 12px;padding:9px 12px;border-radius:var(--r-sm);background:var(--info-soft);
  border:1px dashed #c9dcff;color:#1d4ed8;font-size:11px;font-weight:700;line-height:1.45}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 22px);z-index:70;
  background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;padding:11px 18px;border-radius:999px;
  box-shadow:var(--sh-2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>
</head>

<div class="shell">
  <header class="appbar">
    <div class="branch">
      <span class="branch-dot" id="dot"></span>
      <div style="min-width:0">
        <div class="branch-name" id="branchName">Bangjo Barat</div>
        <div class="branch-sub" id="branchSub">Operasional cabang</div>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" aria-label="Notifikasi" onclick="toast('2 pemberitahuan operasional')">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="dot" id="bellDot"></span>

  </header>

  <main class="screen" id="screen"></main>

  <nav class="tabbar" id="tabbar"></nav>
  <div id="fabHost"></div>

  <div class="sheet-wrap" id="sheetWrap">
    <div class="sheet-bg" onclick="closeSheet()"></div>
    <div class="sheet" id="sheet"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════

    { id:'u3', name:'Sari Melati',  role:'Kasir',   shift:'Sore',  active:false }
  ],
  hours:{ open:'08:00', close:'22:00', exception:null }

/* ── icons (inline, no dependency) ─────────────────────────────────────── */
const I = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
  order:'<path d="M6 2h12l2 5v15H4V7l2-5Z"/><path d="M4 7h16"/><path d="M9 12h6M9 16h6"/>',

  bell:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
  table:'<path d="M4 11h16"/><path d="M4 11V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v5"/><path d="M6 11v8M18 11v8"/>',

function svg(name,size,width){
  return '<svg width="'+(size||22)+'" height="'+(size||22)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
         'stroke-width="'+(width||1.9)+'" stroke-linecap="round" stroke-linejoin="round">'+I[name]+'</svg>';

/* ── tabs: the Branch Manager's daily surface ───────────────────────────── */
const TABS = [
  { id:'beranda', label:'Beranda', icon:'home'  },
  { id:'pesanan', label:'Pesanan', icon:'order' },
  { id:'menu',    label:'Menu',    icon:'menu'  },
  { id:'stok',    label:'Stok',    icon:'stock' },
  { id:'lainnya', label:'Lainnya', icon:'more'  }
];
let tab = 'beranda';

const rupiah = n => 'Rp' + Number(n||0).toLocaleString('id-ID');
const find = (arr,id) => arr.find(x => x.id === id);
const newOrders = () => state.orders.filter(o => o.status === 'new');
const lowStock  = () => state.stock.filter(s => s.qty < s.min);
const soldOut   = () => state.menu.filter(m => !m.available);

/* ── render ────────────────────────────────────────────────────────────── */
function render(){
  document.getElementById('dot').className = 'branch-dot ' + (state.branch.isOpen ? 'open':'closed');
  document.getElementById('branchSub').textContent =
    (state.branch.isOpen ? 'Buka' : 'Tutup') + ' · ' +
    (state.branch.onlineOrders ? 'Order online aktif' : 'Order online dijeda');
  const bell = document.getElementById('bellDot');
  bell.style.display = (newOrders().length || lowStock().length) ? 'block' : 'none';

  const views = { beranda:viewBeranda, pesanan:viewPesanan, menu:viewMenu, stok:viewStok, lainnya:viewLainnya };
  document.getElementById('screen').innerHTML = views[tab]();

  document.getElementById('tabbar').innerHTML = TABS.map(t => {
    const n = t.id === 'pesanan' ? newOrders().length : (t.id === 'stok' ? lowStock().length : 0);
    return '<button class="tab '+(tab===t.id?'active':'')+'" onclick="go(\''+t.id+'\')">'+
      (n ? '<span class="n">'+n+'</span>' : '') + svg(t.icon,21) + '<span>'+t.label+'</span></button>';
  }).join('');

  const fab = { menu:'<button class="fab" onclick="toast(\'Tambah menu dari katalog Owner\')">'+svg('plus',17,2.4)+' Tambah Menu</button>' }[tab] || '';
  document.getElementById('fabHost').innerHTML = fab;
}
function go(id){ tab = id; window.scrollTo(0,0); render(); }
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 1800);
}

    '<div class="section"><div class="card hero">',
      '<div class="hero-top"><div>',
        '<div class="hero-label">Status cabang</div>',
        '<div class="hero-value">'+(state.branch.isOpen?'Sedang buka':'Sedang tutup')+'</div>',
        '<div class="hero-note">'+(state.branch.isOpen
          ? 'Pesanan masuk diproses seperti biasa.'
          : 'Pesanan baru tidak diterima sampai cabang dibuka.')+'</div>',
      '</div>',
      '<button class="switch '+(state.branch.isOpen?'on':'')+'" role="switch" aria-checked="'+state.branch.isOpen+'" aria-label="Buka tutup cabang" onclick="toggle(\'isOpen\')"><i></i></button>',
      '</div>',
      '<div class="hero-row"><div>',
        '<div class="t">Order online</div>',
        '<div class="s">'+(state.branch.onlineOrders ? 'Aktif — pesanan aplikasi & agregator diterima' : 'Dijeda sementara, cabang tetap buka')+'</div>',
      '</div>',
      '<button class="switch '+(state.branch.onlineOrders?'on':'')+'" role="switch" aria-checked="'+state.branch.onlineOrders+'" aria-label="Jeda order online" onclick="toggle(\'onlineOrders\')"><i></i></button>',
      '</div>',
    '</div></div>',

    '<div class="section">',
      '<div class="section-head"><div class="section-title">Perlu perhatian</div>'+
        '<button class="section-link" onclick="go(\'pesanan\')">Lihat semua</button></div>',
      (n ? '<div class="attn danger"><div class="ic">'+svg('bell',18)+'</div><div class="body">'+
            '<div class="t">'+n+' pesanan baru menunggu diterima</div>'+
            '<div class="s">Segera terima/tolak — pembatalan otomatis setelah batas waktu.</div></div>'+
            '<button class="go" onclick="go(\'pesanan\')">'+svg('chev',16,2.4)+'</button></div>' : ''),
      (out ? '<div class="attn"><div class="ic">'+svg('menu',18)+'</div><div class="body">'+
            '<div class="t">'+out+' menu ditandai habis</div>'+
            '<div class="s">Pelanggan tidak bisa memesan menu ini sampai diaktifkan kembali.</div></div>'+
            '<button class="go" onclick="go(\'menu\')">'+svg('chev',16,2.4)+'</button></div>' : ''),
      (low ? '<div class="attn"><div class="ic">'+svg('stock',18)+'</div><div class="body">'+
            '<div class="t">'+low+' bahan di bawah stok minimum</div>'+
            '<div class="s">'+lowStock().map(s=>s.name).join(', ')+'</div></div>'+
            '<button class="go" onclick="go(\'stok\')">'+svg('chev',16,2.4)+'</button></div>' : ''),
      (!n && !low && !out ? '<div class="attn calm"><div class="ic">'+svg('check',18)+'</div><div class="body">'+
            '<div class="t">Semua terkendali</div><div class="s">Tidak ada pesanan menunggu atau stok kritis.</div></div></div>' : ''),
    '</div>',

    '<div class="section">',
      '<div class="section-head"><div class="section-title">Ringkasan hari ini</div>'+
        '<button class="section-link" onclick="toast(\'Laporan harian cabang\')">Detail</button></div>',
      '<div class="stats">',
        '<div class="stat"><div class="k">Penjualan</div><div class="v">'+rupiah(state.sales.revenue)+'</div>'+
          '<div class="d'+(state.sales.delta<0?' down':'')+'">'+(state.sales.delta>0?'▲ ':'▼ ')+Math.abs(state.sales.delta)+'% vs kemarin</div></div>',
        '<div class="stat"><div class="k">Pesanan</div><div class="v">'+state.sales.orders+'</div><div class="d">'+n+' baru</div></div>',
        '<div class="stat"><div class="k">Rata-rata</div><div class="v">'+rupiah(state.sales.avg)+'</div><div class="d">per pesanan</div></div>',
      '</div>',
    '</div>',

    '<div class="section">',
      '<div class="section-head"><div class="section-title">Aksi cepat</div></div>',
      '<div class="qa">',
        '<button class="qa-btn primary" onclick="toggle(\'isOpen\')">'+svg('power',16,2.2)+' '+(state.branch.isOpen?'Tutup cabang':'Buka cabang')+'</button>',
        '<button class="qa-btn" onclick="toggle(\'onlineOrders\')">'+svg('clock',16,2.2)+' '+(state.branch.onlineOrders?'Jeda online':'Aktifkan online')+'</button>',

function toggle(key){
  state.branch[key] = !state.branch[key];
  toast(key === 'isOpen'
    ? (state.branch.isOpen ? 'Cabang dibuka' : 'Cabang ditutup')
    : (state.branch.onlineOrders ? 'Order online diaktifkan' : 'Order online dijeda'));
  render();
}

/* ── Pesanan ───────────────────────────────────────────────────────────── */
let orderFilter = 'new';
function viewPesanan(){
  const list = state.orders.filter(o => orderFilter === 'all' ? true : o.status === orderFilter);
  const seg = [['new','Baru'],['process','Diproses'],['done','Selesai'],['all','Semua']];
  return [
    '<div class="seg">'+seg.map(([k,l]) => {
      const c = k==='all' ? state.orders.length : state.orders.filter(o=>o.status===k).length;
      return '<button class="'+(orderFilter===k?'active':'')+'" onclick="setFilter(\''+k+'\')">'+l+
             (k!=='all' && c ? ' · '+c : '')+'</button>';
    }).join('')+'</div>',
    list.length ? list.map(orderCard).join('')
      : '<div class="empty"><div class="e">🧾</div><div class="t">Belum ada pesanan</div>'+
        '<div class="s">Pesanan baru akan muncul di sini beserta hitungan waktu penerimaan.</div></div>'
  ].join('');
}
function setFilter(f){ orderFilter = f; render(); }
function orderCard(o){
  const badge = { new:['new','BARU'], process:['process','DIPROSES'], done:['done','SELESAI'], reject:['reject','DITOLAK'] }[o.status];
  const typeLabel = { delivery:'Delivery', pickup:'Pickup', 'dine-in':'Dine-in' }[o.type];
  return '<div class="order '+(o.status==='new'?'new fresh':'')+'">'+
    '<div class="order-head"><div style="min-width:0">'+
      '<div class="order-code">'+o.code+'</div>'+
      '<div class="order-meta"><span class="chip '+badge[0]+'">'+badge[1]+'</span>'+
        '<span class="chip tag">'+typeLabel+'</span><span>'+o.time+'</span><span>· '+o.customer+'</span></div>'+
    '</div>'+
    (o.left != null ? '<div style="text-align:right"><div class="countdown'+(o.left<60?' crit':'')+'" id="cd-'+o.id+'">'+mmss(o.left)+'</div>'+
      '<div style="font-size:10px;color:var(--muted);font-weight:700">sisa waktu</div></div>' : '')+
    '</div>'+
    '<div class="order-items">'+o.items.map(([n,q])=>'<div class="order-line"><span>'+q+'× '+n+'</span><b>'+rupiah(o.total/o.items.length*q)+'</b></div>').join('')+'</div>'+
    '<div class="order-foot"><div class="order-total">'+rupiah(o.total)+'</div>'+
      '<div class="order-actions">'+
        (o.status==='new'
          ? '<button class="btn reject" onclick="setOrder(\''+o.id+'\',\'reject\')">Tolak</button>'+
            '<button class="btn accept" onclick="setOrder(\''+o.id+'\',\'process\')">Terima</button>'
          : '<button class="btn ghost" onclick="openOrder(\''+o.id+'\')">Detail</button>'+
            (o.status==='process' ? '<button class="btn primary" onclick="setOrder(\''+o.id+'\',\'done\')">Selesaikan</button>' : ''))+
      '</div>'+
    '</div></div>';
}
function setOrder(id,status){
  const o = find(state.orders,id); if(!o) return;
  o.status = status; if(status !== 'new') o.left = null;
  toast(status==='process' ? 'Pesanan '+o.code+' diterima' : status==='reject' ? 'Pesanan '+o.code+' ditolak' : 'Pesanan '+o.code+' selesai');
  if(orderFilter==='new' && status!=='new') orderFilter = 'process';
  render();
}
const mmss = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');

/* ── Menu ──────────────────────────────────────────────────────────────── */
let menuQ = '', menuCat = 'Semua';
function viewMenu(){
  const cats = ['Semua'].concat([...new Set(state.menu.map(m=>m.cat))]);
  const list = state.menu.filter(m =>
    (menuCat==='Semua' || m.cat===menuCat) &&
    (!menuQ || m.name.toLowerCase().includes(menuQ)));
  return [
    '<div class="search">'+svg('search',18)+'<input id="menuQ" placeholder="Cari menu" value="'+menuQ+'" '+
      'oninput="menuQ=this.value;var p=this.selectionStart;render();var e=document.getElementById(\'menuQ\');if(e){e.focus();e.setSelectionRange(p,p);}"></div>',
    '<div class="cats">'+cats.map(c=>'<button class="cat '+(menuCat===c?'active':'')+'" onclick="menuCat=\''+c+'\';render()">'+c+'</button>').join('')+'</div>',
    (soldOut().length ? '<div class="attn"><div class="ic">'+svg('menu',18)+'</div><div class="body">'+
      '<div class="t">'+soldOut().length+' menu sedang habis</div><div class="s">Tap tombol di kanan untuk mengaktifkan kembali.</div></div></div>' : ''),
    list.length ? list.map(menuRow).join('')
      : '<div class="empty"><div class="e">🔍</div><div class="t">Menu tidak ditemukan</div><div class="s">Coba kata kunci lain.</div></div>'
  ].join('');
}
function menuRow(m){
  return '<div class="row '+(m.available?'':'off')+'">'+
    '<div class="thumb">'+svg('menu',20)+'</div>'+
    '<div class="grow"><div class="name">'+m.name+'</div>'+
      '<div class="sub">'+rupiah(m.price)+' · '+m.cat+' · terjual '+m.sold+'</div></div>'+
    '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">'+
      '<button class="switch '+(m.available?'on primary':'')+'" role="switch" aria-checked="'+m.available+'" '+
        'aria-label="Ketersediaan '+m.name+'" onclick="toggleMenu(\''+m.id+'\')"><i></i></button>'+
      '<span class="pill '+(m.available?'ok':'low')+'">'+(m.available?'Tersedia':'Habis')+'</span>'+
    '</div></div>';
}
function toggleMenu(id){
  const m = find(state.menu,id); if(!m) return;
  m.available = !m.available;
  toast(m.available ? m.name+' diaktifkan' : m.name+' ditandai habis');
  render();
}

/* ── Stok ──────────────────────────────────────────────────────────────── */
function viewStok(){
  const low = lowStock();
  return [
    (low.length ? '<div class="attn"><div class="ic">'+svg('alert',18)+'</div><div class="body">'+
      '<div class="t">'+low.length+' bahan di bawah stok minimum</div>'+
      '<div class="s">'+low.map(s=>s.name+' ('+s.qty+' '+s.unit+')').join(', ')+'</div></div></div>'
      : '<div class="attn calm"><div class="ic">'+svg('check',18)+'</div><div class="body">'+
        '<div class="t">Stok cabang aman</div><div class="s">Semua bahan di atas batas minimum.</div></div></div>'),
    '<div class="section-head" style="margin-top:14px"><div class="section-title">Bahan & persediaan</div></div>',
    state.stock.map(s => {
      const isLow = s.qty < s.min;
      return '<div class="row">'+
        '<div class="thumb">'+svg('stock',20)+'</div>'+
        '<div class="grow"><div class="name">'+s.name+'</div>'+
          '<div class="sub">min. '+s.min+' '+s.unit+'</div></div>'+
        '<div style="text-align:right">'+
          '<div class="stock-qty'+(isLow?' low':'')+'">'+s.qty+' <span style="font-size:11px;font-weight:700">'+s.unit+'</span></div>'+
          '<span class="pill '+(isLow?'low':'ok')+'">'+(isLow?'Menipis':'Aman')+'</span>'+
        '</div>'+
        '<button class="btn ghost" onclick="adjustStock(\''+s.id+'\')">Sesuaikan</button>'+
      '</div>';
    }).join('')
  ].join('');
}
function adjustStock(id){
  const s = find(state.stock,id); if(!s) return;
  openSheet(
    '<h3>Sesuaikan stok</h3><div class="muted">'+s.name+' — gunakan untuk pemakaian harian cabang.</div>'+
    '<div class="kv"><span class="k">Stok saat ini</span><span class="v">'+s.qty+' '+s.unit+'</span></div>'+
    '<div class="kv"><span class="k">Batas minimum</span><span class="v">'+s.min+' '+s.unit+'</span></div>'+
    '<div class="sheet-actions">'+
      '<button class="btn ghost block" onclick="bumpStock(\''+s.id+'\',-1)">− 1 '+s.unit+'</button>'+
      '<button class="btn accept block" onclick="bumpStock(\''+s.id+'\',+1)">+ 1 '+s.unit+'</button>'+
    '</div>'
  );
}
function bumpStock(id,delta){
  const s = find(state.stock,id); if(!s) return;
  s.qty = Math.max(0, s.qty + delta);
  toast(s.name+' → '+s.qty+' '+s.unit);
  closeSheet(); render();
}

render();
/* prototype-only countdown tick: pure visual, no order state is mutated by it */
setInterval(function(){
  if (tab !== 'pesanan') return;
  state.orders.forEach(o => { if (o.status === 'new' && o.left > 0) o.left--; });
  state.orders.forEach(o => {
    const el = document.getElementById('cd-' + o.id);
    if (el) { el.textContent = mmss(Math.max(0, o.left)); el.className = 'countdown' + (o.left < 60 ? ' crit' : ''); }
  });
}, 1000);
</script>
