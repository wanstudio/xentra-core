<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Xentra Managerial</title>
  <meta name="description" content="Aplikasi Manajerial & Operasional Xentra">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Managerial">
  <link rel="apple-touch-icon" href="/merchant-app/assets/icons/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0f172a;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #94a3b8;
    }
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.08);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    (function () {
      'use strict';
      try {
        var token = localStorage.getItem('xentra_merchant_token');
        var userStr = localStorage.getItem('xentra_merchant_user');
        if (!token || !userStr) {
          window.location.replace('/login');
          return;
        }
        var user = JSON.parse(userStr);
        var role = user && user.role;
        if (role === 'branch_manager' || role === 'manager') {
          window.location.replace('/merchant/' + window.location.hash);
        } else if (role === 'owner' || role === 'brand_manager') {
          window.location.replace('/dashboard/' + window.location.hash);
        } else {
          localStorage.removeItem('xentra_merchant_token');
          localStorage.removeItem('xentra_merchant_user');
          window.location.replace('/login?error=ROLE_MISMATCH&target=pos');
        }
      } catch (_) {
        window.location.replace('/login');
      }
    })();
  </script>
</head>
<body>
  <div class="loader"></div>
</body>
</html>
