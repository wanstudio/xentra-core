<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login Merchant — Xentra Restaurant Operating Engine</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-lime: #b6ff00;
      --border-color: #e2e8f0;
      --radius-lg: 16px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(182, 255, 0, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(30, 41, 59, 0.5) 0px, transparent 50%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text-main);
    }

    .x-login-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .x-brand-header {
      margin-bottom: 28px;
      text-align: center;
    }

    .x-xentra-logo {
      height: 48px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4)) invert(1) brightness(1.2);
    }

    .x-login-card {
      background: var(--card-bg);
      width: 100%;
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .x-card-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .x-card-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .x-store-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 20px;
    }

    .x-store-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
    }

    .x-form-group {
      margin-bottom: 18px;
    }

    .x-form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }

    .x-input-wrap {
      position: relative;
    }

    .x-password-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .x-password-wrap .x-input {
      padding-right: 48px;
    }

    .x-btn-toggle-pw {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .x-btn-toggle-pw:hover {
      color: #0f172a;
      background: #f1f5f9;
    }

    .x-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      background: #f8fafc;
      transition: all 0.2s;
      outline: none;
    }

    .x-input:focus {
      background: #ffffff;
      border-color: #0f172a;
      box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1);
    }

    .x-options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: -6px;
      margin-bottom: 20px;
    }

    .x-checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
    }

    .x-checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #0f172a;
    }

    .x-btn-submit {
      width: 100%;
      background: #0f172a;
      color: #ffffff;
      padding: 14px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .x-btn-submit:hover {
      background: #1e293b;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
    }

    .x-btn-submit:active {
      transform: translateY(0);
    }

    .x-btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .x-alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
      display: none;
    }

    .x-login-footer-nav {
      margin-top: 24px;
      text-align: center;
    }

    .x-link-back {
      font-size: 13px;
      color: #94a3b8;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .x-link-back:hover {
      color: #ffffff;
    }

    .x-powered-footer {
      margin-top: 36px;
      text-align: center;
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="x-login-container">
    
    <!-- Official Xentra Logo -->
    <div class="x-brand-header">
      <a href="/">
        <img src="/assets/img/xentra-logo.png" onerror="this.src='/assets/icons/xentra-logo.png'" alt="Xentra — Restaurant Operating Engine" class="x-xentra-logo">
      </a>
    </div>

      <!-- Login Card (wp-admin style) -->
      <div class="x-login-card">
        <div class="x-store-badge">
          <span class="x-store-dot"></span>
          <span id="store-name-badge">Portal Restaurant: app.mybangjo.com</span>
        </div>

        <h1 class="x-card-title">Masuk ke Dashboard</h1>
        <p class="x-card-subtitle">Kelola menu, logo brand, cabang pengiriman, dan pantau pesanan dapur secara realtime.</p>

        <div id="login-error" class="x-alert-error"></div>

        <form id="form-merchant-login">
          <div class="x-form-group">
            <label for="username">Username / Email Restaurant</label>
            <div class="x-input-wrap">
              <input type="text" id="username" class="x-input" placeholder="admin" value="admin" required autocomplete="username">
            </div>
          </div>

          <div class="x-form-group">
            <label for="password">Password Restaurant</label>
            <div class="x-password-wrap">
              <input type="password" id="password" class="x-input" placeholder="••••••••" value="bangjo123" required autocomplete="current-password">
              <button type="button" class="x-btn-toggle-pw" id="btn-toggle-pw" title="Tampilkan / Sembunyikan Password" aria-label="Toggle Password Visibility">
                <svg id="icon-eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg id="icon-eye-closed" style="display:none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
              </button>
            </div>
          </div>

          <div class="x-options-row">
            <label class="x-checkbox-label">
              <input type="checkbox" id="remember" checked>
              <span>Ingat saya</span>
            </label>
          </div>

          <button type="submit" class="x-btn-submit" id="btn-login">
            <span>Masuk ke Dashboard</span>
          </button>
        </form>
      </div>

      <!-- Navigation link back to Customer ordering page -->
      <div class="x-login-footer-nav">
        <a href="/" class="x-link-back">
          <span>&larr;</span> <span>Lihat Halaman Restaurant (Customer Menu)</span>
        </a>
      </div>

      <!-- Platform Footer -->
      <div class="x-powered-footer">
        XENTRA RESTAURANT OPERATING ENGINE &bull; STANDALONE SYSTEM
      </div>

    </div>

  </div>

  <script>
    (function () {
      'use strict';
      var TOKEN_KEY = 'xentra_merchant_token';
      var USER_KEY = 'xentra_merchant_user';

      // 1. If already logged in, redirect directly to dashboard
      if (localStorage.getItem(TOKEN_KEY)) {
        window.location.href = '/dashboard/';
        return;
      }

      // 2. Toggle Password Visibility
      var btnTogglePw = document.getElementById('btn-toggle-pw');
      var pwInput = document.getElementById('password');
      var eyeOpen = document.getElementById('icon-eye-open');
      var eyeClosed = document.getElementById('icon-eye-closed');

      if (btnTogglePw && pwInput) {
        btnTogglePw.addEventListener('click', function(e) {
          e.preventDefault();
          if (pwInput.type === 'password') {
            pwInput.type = 'text';
            if (eyeOpen) eyeOpen.style.display = 'none';
            if (eyeClosed) eyeClosed.style.display = 'block';
          } else {
            pwInput.type = 'password';
            if (eyeOpen) eyeOpen.style.display = 'block';
            if (eyeClosed) eyeClosed.style.display = 'none';
          }
        });
      }

      // 3. Handle Login Submit
      var form = document.getElementById('form-merchant-login');
      var errorBox = document.getElementById('login-error');
      var btn = document.getElementById('btn-login');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errorBox.style.display = 'none';
        btn.disabled = true;
        btn.innerHTML = '<span>Memverifikasi kredensial...</span>';

        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value.trim();

        try {
          var res = await fetch('/api/v1/auth/merchant/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
          });

          var data = null;
          try {
            data = await res.json();
          } catch (_) {}

          if (data && data.success && data.token) {
            localStorage.setItem(TOKEN_KEY, data.token);
            localStorage.setItem(USER_KEY, JSON.stringify(data.user));
            btn.innerHTML = '<span>Login berhasil! Mengalihkan...</span>';
            setTimeout(function () {
              window.location.href = '/dashboard/';
            }, 250);
            return;
          }
        } catch (fetchErr) {
          console.warn('[Login fetch warn]:', fetchErr);
        }

        // NO client-side session fabrication. A failed server login (wrong
        // password, network error) must never write a local token: the dashboard
        // would validate it, get 401, and bounce straight back here (login loop).
        errorBox.textContent = '❌ ' + ((data && (data.error || data.message)) || 'Username atau password yang Anda masukkan salah.');
        errorBox.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<span>Masuk ke Dashboard</span>';
      });
    })();
  </script>
</body>
</html>
