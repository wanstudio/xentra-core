<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>Xentra Kitchen — Antrean Dapur</title>
<link rel="stylesheet" href="/merchant-shared/css/shared.css?v=1.0.0">
<link rel="stylesheet" href="/kitchen-app/assets/css/kitchen-app.css?v=1.0.0">
</head>
<body class="kds">
  <script>
    (function () {
      window.Xentra = window.Xentra || {};
      window.Xentra.showSplash = function (message) {
        var el = document.getElementById('x-splash');
        if (el) {
          el.style.display = 'flex';
          var txt = document.getElementById('x-splash-text');
          if (txt && typeof message === 'string') {
            txt.textContent = message;
          }
        }
      };
      window.Xentra.hideSplash = function () {
        var el = document.getElementById('x-splash');
        if (el) el.style.display = 'none';
      };
      window.__xentraHideSplash = window.Xentra.hideSplash;

      window.addEventListener('pageshow', function () {
        if (window.Xentra && typeof window.Xentra.hideSplash === 'function') {
          window.Xentra.hideSplash();
        }
      });

      setTimeout(window.__xentraHideSplash, 3000);
    })();
  </script>

  <div id="x-splash" style="position:fixed;inset:0;z-index:99999;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;">
    <style>
      #x-splash .bot-arm-l, #x-splash .bot-arm-r { transform-box: fill-box; transform-origin: 50% 0%; }
      #x-splash .bot-float { animation: bot-float 2.6s ease-in-out infinite alternate; }
      #x-splash .bot-shadow { animation: bot-shadow 2.6s ease-in-out infinite alternate; }
      #x-splash .bot-eye { animation: bot-blink 4.2s steps(1, end) infinite; transform-box: fill-box; transform-origin: center; }
      #x-splash .bot-arm-l { animation: bot-flap-l 1.3s ease-in-out infinite alternate; }
      #x-splash .bot-arm-r { animation: bot-flap-r 1.3s ease-in-out infinite alternate; }
      @keyframes bot-float { from { transform: translateY(0); } to { transform: translateY(-4px); } }
      @keyframes bot-shadow { from { transform: scaleX(1); opacity:.18; } to { transform: scaleX(.78); opacity:.10; } }
      @keyframes bot-blink { 0%, 44%, 48%, 92%, 96%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.12); } 94% { transform: scaleY(.12); } }
      @keyframes bot-flap-l { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
      @keyframes bot-flap-r { from { transform: rotate(22deg); } to { transform: rotate(-22deg); } }
      @media (prefers-reduced-motion: reduce) {
        #x-splash .bot-float, #x-splash .bot-shadow, #x-splash .bot-eye,
        #x-splash .bot-arm-l, #x-splash .bot-arm-r { animation: none; }
      }
    </style>

    <svg width="88" height="96" viewBox="0 0 92 100" aria-hidden="true">
      <defs>
        <linearGradient id="botBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"></stop>
          <stop offset="1" stop-color="#e9eef3"></stop>
        </linearGradient>
      </defs>

      <!-- bayangan: penanda mengambang -->
      <ellipse class="bot bot-shadow" cx="46" cy="96" rx="16" ry="4" fill="#111827" opacity=".15"></ellipse>

      <g class="bot bot-float">
        <!-- tangan: elips telur ramping, mengambang terpisah dari badan -->
        <ellipse class="bot bot-arm-l" cx="15" cy="52" rx="4.4" ry="16" fill="#ffffff" stroke="#d1d5db" stroke-width="1.4"></ellipse>
        <ellipse class="bot bot-arm-r" cx="77" cy="52" rx="4.4" ry="16" fill="#ffffff" stroke="#d1d5db" stroke-width="1.4"></ellipse>

        <!-- badan: lebar di atas, meruncing ke bawah, ujungnya tetap bulat -->
        <path d="M46 8 C62 8 72 22 72 44 C72 78 54 94 46 94 C38 94 20 78 20 44 C20 22 30 8 46 8 Z"
              fill="url(#botBody)" stroke="#d1d5db" stroke-width="1.6"></path>

        <!-- layar muka gelap + dua mata besar -->
        <rect x="26" y="20" width="40" height="34" rx="17" fill="#111827"></rect>
        <g class="bot bot-eye">
          <ellipse cx="38.5" cy="37" rx="6.2" ry="7" fill="#ffffff"></ellipse>
          <ellipse cx="53.5" cy="37" rx="6.2" ry="7" fill="#ffffff"></ellipse>
        </g>
      </g>
    </svg>

    <img src="/assets/img/xentra-logo.png" onerror="this.onerror=null;this.src='/assets/icons/xentra-logo.png'" alt="Xentra" style="width:56px;height:56px;object-fit:contain;opacity:.9;margin-top:2px;">
    <div id="x-splash-text" style="color:#64748b;font-size:13px;font-weight:600;letter-spacing:-0.01em;margin-top:2px;">Memuat…</div>
  </div>

<header class="kds-bar">
  <div class="kds-brand">
    <span class="kds-logo">🍳</span>
    <div>
      <div class="kds-title">Antrean Dapur</div>
      <div class="kds-sub" id="kds-branch">Memuat cabang…</div>
    </div>
  </div>
  <div class="kds-bar-right">
    <div class="kds-counts" id="kds-counts"></div>
    <button type="button" class="kds-btn-ghost" id="kds-refresh" aria-label="Muat ulang antrean">Muat ulang</button>
    <button type="button" class="kds-btn-ghost" id="kds-logout">Keluar</button>
  </div>
</header>

<div class="kds-statusbar">
  <span class="kds-dot" id="kds-conn"></span>
  <span id="kds-conn-text">Menghubungkan…</span>
  <span class="kds-sep">·</span>
  <span id="kds-clock">--:--</span>
</div>

<main class="kds-board" id="kds-board">
  <section class="kds-col" data-col="confirmed">
    <h2 class="kds-col-title">Perlu dimasak <span class="kds-col-n" id="n-confirmed">0</span></h2>
    <div class="kds-list" id="list-confirmed"><p class="kds-empty">Memuat…</p></div>
  </section>
  <section class="kds-col" data-col="preparing">
    <h2 class="kds-col-title">Sedang dimasak <span class="kds-col-n" id="n-preparing">0</span></h2>
    <div class="kds-list" id="list-preparing"></div>
  </section>
  <section class="kds-col" data-col="ready">
    <h2 class="kds-col-title">Siap diambil <span class="kds-col-n" id="n-ready">0</span></h2>
    <div class="kds-list" id="list-ready"></div>
  </section>
</main>

<div id="x-toast-container" class="x-toast-container"></div>

<script src="/merchant-shared/js/shared.js?v=1.0.0"></script>
<script src="/kitchen-app/assets/js/kitchen-app.js?v=1.0.0"></script>
</body>
</html>
