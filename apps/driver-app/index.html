<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Xentra Driver">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/driver/manifest.json">
  <link rel="stylesheet" href="/merchant-shared/fonts/plus-jakarta-sans.css">
  <link rel="stylesheet" href="/merchant-shared/css/shared.css?v=1.0.3">
  <link rel="stylesheet" href="/driver/assets/css/driver.css?v=4">
  <title>Xentra Driver</title>
</head>
<body>
  <script>
    (function () {
      window.Xentra = window.Xentra || {};
      window.Xentra.showSplash = function (message) {
        var el = document.getElementById('x-splash');
        if (el) {
          el.style.display = 'flex';
          var txt = document.getElementById('x-splash-text');
          if (txt && typeof message === 'string') {
            txt.textContent = message;
          }
        }
      };
      window.Xentra.hideSplash = function () {
        var el = document.getElementById('x-splash');
        if (el) el.style.display = 'none';
      };
      window.__xentraHideSplash = window.Xentra.hideSplash;

      window.addEventListener('pageshow', function () {
        if (window.Xentra && typeof window.Xentra.hideSplash === 'function') {
          window.Xentra.hideSplash();
        }
      });

      setTimeout(window.__xentraHideSplash, 3000);
    })();
  </script>

  <div id="x-splash" style="position:fixed;inset:0;z-index:99999;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;">
    <style>
      #x-splash .bot-arm-l, #x-splash .bot-arm-r { transform-box: fill-box; transform-origin: 50% 0%; }
      #x-splash .bot-float { animation: bot-float 2.6s ease-in-out infinite alternate; }
      #x-splash .bot-shadow { animation: bot-shadow 2.6s ease-in-out infinite alternate; }
      #x-splash .bot-eye { animation: bot-blink 4.2s steps(1, end) infinite; transform-box: fill-box; transform-origin: center; }
      #x-splash .bot-arm-l { animation: bot-flap-l 1.3s ease-in-out infinite alternate; }
      #x-splash .bot-arm-r { animation: bot-flap-r 1.3s ease-in-out infinite alternate; }
      @keyframes bot-float { from { transform: translateY(0); } to { transform: translateY(-4px); } }
      @keyframes bot-shadow { from { transform: scaleX(1); opacity:.18; } to { transform: scaleX(.78); opacity:.10; } }
      @keyframes bot-blink { 0%, 44%, 48%, 92%, 96%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.12); } 94% { transform: scaleY(.12); } }
      @keyframes bot-flap-l { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
      @keyframes bot-flap-r { from { transform: rotate(22deg); } to { transform: rotate(-22deg); } }
      @media (prefers-reduced-motion: reduce) {
        #x-splash .bot-float, #x-splash .bot-shadow, #x-splash .bot-eye,
        #x-splash .bot-arm-l, #x-splash .bot-arm-r { animation: none; }
      }
    </style>

    <svg width="88" height="96" viewBox="0 0 92 100" aria-hidden="true">
      <defs>
        <linearGradient id="botBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"></stop>
          <stop offset="1" stop-color="#e9eef3"></stop>
        </linearGradient>
      </defs>

      <!-- bayangan: penanda mengambang -->
      <ellipse class="bot bot-shadow" cx="46" cy="96" rx="16" ry="4" fill="#111827" opacity=".15"></ellipse>

      <g class="bot bot-float">
        <!-- tangan: elips telur ramping, mengambang terpisah dari badan -->
        <ellipse class="bot bot-arm-l" cx="15" cy="52" rx="4.4" ry="16" fill="#ffffff" stroke="#d1d5db" stroke-width="1.4"></ellipse>
        <ellipse class="bot bot-arm-r" cx="77" cy="52" rx="4.4" ry="16" fill="#ffffff" stroke="#d1d5db" stroke-width="1.4"></ellipse>

        <!-- badan: lebar di atas, meruncing ke bawah, ujungnya tetap bulat -->
        <path d="M46 8 C62 8 72 22 72 44 C72 78 54 94 46 94 C38 94 20 78 20 44 C20 22 30 8 46 8 Z"
              fill="url(#botBody)" stroke="#d1d5db" stroke-width="1.6"></path>

        <!-- layar muka gelap + dua mata besar -->
        <rect x="26" y="20" width="40" height="34" rx="17" fill="#111827"></rect>
        <g class="bot bot-eye">
          <ellipse cx="38.5" cy="37" rx="6.2" ry="7" fill="#ffffff"></ellipse>
          <ellipse cx="53.5" cy="37" rx="6.2" ry="7" fill="#ffffff"></ellipse>
        </g>
      </g>
    </svg>

    <img src="/assets/img/xentra-logo.png" onerror="this.onerror=null;this.src='/assets/icons/xentra-logo.png'" alt="Xentra" style="width:56px;height:56px;object-fit:contain;opacity:.9;margin-top:2px;">
    <div id="x-splash-text" style="color:#64748b;font-size:13px;font-weight:600;letter-spacing:-0.01em;margin-top:2px;">Memuat…</div>
  </div>

  <div id="driver-app" class="driver-app"></div>

  <!-- MODAL: REUSABLE IMAGE CROP EDITOR (MEDIA ENGINE) -->
  <div id="modal-crop-editor" class="x-modal-backdrop" style="display:none; z-index: 12010;" role="dialog" aria-modal="true" aria-labelledby="crop-editor-title">
    <div class="x-crop-modal-card">
      <div class="x-modal-header">
        <div>
          <h3 id="crop-editor-title">Sesuaikan Posisi &amp; Potongan Foto</h3>
          <p id="crop-editor-subtitle" class="text-muted" style="font-size:12px;margin:0;">Geser dan sesuaikan zoom untuk framing terbaik.</p>
        </div>
        <button type="button" class="x-modal-close" id="btn-crop-close" aria-label="Tutup Editor Crop">✕</button>
      </div>

      <div class="x-crop-body">
        <!-- Interactive Viewport -->
        <div id="crop-viewport" class="x-crop-viewport" tabindex="0" role="region" aria-label="Area Crop Interaktif">
          <div id="crop-canvas-wrapper" class="x-crop-canvas-wrapper">
            <img id="crop-target-image" class="x-crop-image" alt="Preview Gambar Crop" src="" />
          </div>
          <!-- Framing border overlay -->
          <div id="crop-framing-box" class="x-crop-overlay">
            <div class="x-crop-grid">
              <div class="x-crop-grid-line-v x-crop-grid-line-h"></div>
              <div class="x-crop-grid-line-v x-crop-grid-line-h"></div>
              <div class="x-crop-grid-line-h"></div>
              <div class="x-crop-grid-line-v x-crop-grid-line-h"></div>
              <div class="x-crop-grid-line-v x-crop-grid-line-h"></div>
              <div class="x-crop-grid-line-h"></div>
              <div class="x-crop-grid-line-v"></div>
              <div class="x-crop-grid-line-v"></div>
              <div></div>
            </div>
          </div>
        </div>

        <!-- Toolbar & Zoom Controls -->
        <div class="x-crop-toolbar">
          <div class="x-crop-slider-group">
            <span class="x-crop-slider-label">🔍 Zoom:</span>
            <input type="range" id="crop-zoom-slider" class="x-crop-slider" min="1.0" max="3.0" step="0.05" value="1.0" aria-label="Tingkat Zoom" />
            <span id="crop-zoom-value" class="x-crop-slider-label" style="min-width:36px;">100%</span>
          </div>
          <div style="display:flex;gap:6px;">
            <button type="button" id="btn-crop-zoom-out" class="x-crop-tool-btn" title="Perkecil">−</button>
            <button type="button" id="btn-crop-zoom-in" class="x-crop-tool-btn" title="Perbesar">＋</button>
            <button type="button" id="btn-crop-reset" class="x-crop-tool-btn" title="Reset Posisi &amp; Zoom">🔄 Reset</button>
          </div>
        </div>

        <!-- Info Bar -->
        <div class="x-crop-info-bar">
          <span id="crop-dimensions-info">Dimensi: -</span>
          <span id="crop-ratio-info">Rasio Target: 1:1</span>
        </div>
      </div>

      <div class="x-modal-footer">
        <button type="button" class="x-btn-secondary" id="btn-crop-cancel">Batal</button>
        <button type="button" class="x-btn-primary" id="btn-crop-confirm">✓ Gunakan Potongan</button>
      </div>
    </div>
  </div>

  <script src="/merchant-shared/js/crop-editor.js?v=1.0.2"></script>
  <script src="/driver/assets/js/driver-app.js?v=4"></script>
  <script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/driver/sw.js", { scope: "/driver/" }).catch(function () {}); }</script>
</body>
</html>
