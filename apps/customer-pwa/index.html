  <!-- ══════════════════════════════════════════════════════════════
       PWA VERSION SENTINEL & EARLY INSTALL PROMPT CAPTURE
       Executes immediately in <head> to capture beforeinstallprompt on Android
       ══════════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      var PWA_VERSION = 'v_0d17ec1';
      try {
        if (localStorage.getItem('__xentra_rel') !== PWA_VERSION) {
          localStorage.setItem('__xentra_rel', PWA_VERSION);
          if ('caches' in window) {
            caches.keys().then(function (names) {
              return Promise.all(names.map(function (n) { return caches.delete(n); }));
            }).catch(function () {});
          }
        }
      } catch (_) {}

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__xentra_deferred_prompt = e;
      });
    })();
  </script>

  <!-- ═══════════════════════════════════════════════════
       SPA ROUTER & VIEW COORDINATOR
       ═══════════════════════════════════════════════════ -->
  <script>
    (function () {
      var Router = window.Xentra && window.Xentra.Router;
      var Checkout = window.Xentra && window.Xentra.Checkout;
      var OrderReceived = window.Xentra && window.Xentra.OrderReceived;

      if (!Router) return;

      function updateViews(view, params) {
        var homeEl = document.getElementById('xentra-home-view');
        var checkoutEl = document.getElementById('xentra-checkout-view');
        var orderEl = document.getElementById('xentra-order-view');

        if (view === 'checkout') {
          if (homeEl) homeEl.style.display = 'none';
          if (orderEl) orderEl.style.display = 'none';
          if (checkoutEl) {
            checkoutEl.style.display = 'block';
            if (Checkout) Checkout.mount(checkoutEl, params);
            window.scrollTo(0, 0);
          }
        } else if (view === 'order-received') {
          if (homeEl) homeEl.style.display = 'none';
          if (checkoutEl) checkoutEl.style.display = 'none';
          if (orderEl) {
            orderEl.style.display = 'block';
            if (OrderReceived) OrderReceived.mount(orderEl, params && params.orderId);
            window.scrollTo(0, 0);
          }
        } else {
          // Home
          if (checkoutEl) checkoutEl.style.display = 'none';
          if (orderEl) orderEl.style.display = 'none';
          if (homeEl) {
            homeEl.style.display = 'block';
            if (window.XentraHome && typeof window.XentraHome.refresh === 'function') {
              window.XentraHome.refresh();
            }
            window.scrollTo(0, 0);
          }
        }
      }

      Router.subscribe(updateViews);

      // Initial route
      var initialView = Router.getViewFromUrl();
      var initialOrderId = Router.getOrderIdFromUrl();
      var initialItemId = Router.getItemIdFromUrl();
      if (initialView !== 'home') {
        updateViews(initialView, { orderId: initialOrderId, itemId: initialItemId });
      }

      // Intercept Cart Link click
      var cartLink = document.getElementById('x-cart-checkout-link');
      if (cartLink) {
        cartLink.onclick = function (e) {
          e.preventDefault();
          Router.navigate('checkout');
        };
      }
    })();
  </script>

  <!-- ═══════════════════════════════════════════════════
       SERVICE WORKER ENGINE (Clean & Smooth)
       ═══════════════════════════════════════════════════ -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js?v=0d17ec1').then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var newWorker = reg.installing;
          if (newWorker) {
            newWorker.addEventListener('statechange', function () {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                newWorker.postMessage({ action: 'skipWaiting' });
              }
            });
          }
        });
      }).catch(function (err) {
        console.warn('[PWA] Registration warn:', err);
      });

      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    }
  </script>
