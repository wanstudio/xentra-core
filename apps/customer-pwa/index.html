  <!-- Early theme bootstrap: apply saved brand primary color before CSS renders -->
  <script>
    (function () {
      // Early theme bootstrap: apply saved brand primary color before CSS renders to prevent theme flash
      try {
        var rawBrand = localStorage.getItem('xentra_v2_brand');
        if (rawBrand) {
          var b = JSON.parse(rawBrand);
          if (b && b.primary_color) {
            var hex = b.primary_color.trim();
            var cHex = hex.replace(/^#/, '');
            if (cHex.length === 3) cHex = cHex[0] + cHex[0] + cHex[1] + cHex[1] + cHex[2] + cHex[2];
            if (cHex.length === 6) {
              var r = parseInt(cHex.substring(0, 2), 16);
              var g = parseInt(cHex.substring(2, 4), 16);
              var bl = parseInt(cHex.substring(4, 6), 16);
              var lum = (0.299 * r + 0.587 * g + 0.114 * bl) / 255;
              var textHex = lum > 0.6 ? '#111111' : '#ffffff';
              var heroText = textHex === '#ffffff' ? '#ffffff' : '#0f172a';
              var heroSub = textHex === '#ffffff' ? '#e2e8f0' : '#1e293b';

              var rootEl = document.documentElement;
              rootEl.style.setProperty('--x-primary', hex);
              rootEl.style.setProperty('--x-lime', hex);
              rootEl.style.setProperty('--primary-color', hex);
              rootEl.style.setProperty('--x-primary-text', textHex);
              rootEl.style.setProperty('--primary-text', textHex);
              rootEl.style.setProperty('--primary-foreground', textHex);
              rootEl.style.setProperty('--x-primary-foreground', textHex);
              rootEl.style.setProperty('--x-hero-text', heroText);
              rootEl.style.setProperty('--x-hero-text-sub', heroSub);
              var m = document.querySelector('meta[name="theme-color"]');
              if (m) m.setAttribute('content', hex);
            }
          }
        }
      } catch (_) {}

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__xentra_deferred_prompt = e;
      });
    })();
  </script>

    (function () {

      window.__xentraHideSplash = function () {
        if (done) return;
        done = true;
        var el = document.getElementById('x-splash');
        if (el) el.style.display = 'none';
        var sk = document.getElementById('x-skeleton');
        if (sk) sk.style.display = 'block';
      };
      setTimeout(window.__xentraHideSplash, 3000);

  <!-- ═══════════════════════════════════════════════════
       SPA ROUTER & VIEW COORDINATOR
       ═══════════════════════════════════════════════════ -->
  <script>
    (function () {
      var Router = window.Xentra && window.Xentra.Router;

      if (!Router) return;

      // ── Deterministic lazy loader for ROUTE_ONLY controllers ──
      // checkout / order-received / aux-pages are NOT part of the initial Home
      // boot; they load on first navigation to their route, then mount. Every
      // CORE module (store/ui/api/nav/router/media/…) stays eagerly loaded, so a
      // controller's dependencies are always present when it executes.
      var _scriptPromises = {};
      function loadScriptOnce(src) {
        if (_scriptPromises[src]) return _scriptPromises[src];
        _scriptPromises[src] = new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = src;
          s.async = false;
          s.onload = function () { resolve(); };
          s.onerror = function () { reject(new Error('Failed to load ' + src)); };
          document.head.appendChild(s);
        });
        return _scriptPromises[src];
      }

      // ── Deterministic lazy loader for ROUTE_ONLY stylesheets ──
      // order-received.css & location-picker.css are not needed for the Home
      // first paint; each is fetched once, only when its view/feature is used,
      // and callers wait for readiness BEFORE showing the view (no FOUC).
      var _stylePromises = {};
      function loadStylesheetOnce(href) {
        if (_stylePromises[href]) return _stylePromises[href];
        // Already present in the document (e.g. previously loaded) → resolve now,
        // never create a duplicate <link>.
        if (document.querySelector('link[rel="stylesheet"][href="' + href + '"]')) {
          _stylePromises[href] = Promise.resolve();
          return _stylePromises[href];
        }
        _stylePromises[href] = new Promise(function (resolve, reject) {
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = href;
          l.onload = function () { resolve(); };
          l.onerror = function () { reject(new Error('Failed to load ' + href)); };
          document.head.appendChild(l);
        });
        return _stylePromises[href];
      }

      window.Xentra = window.Xentra || {};
      window.Xentra.loadStylesheetOnce = loadStylesheetOnce;
      window.Xentra.ensureOrderReceivedCss = function () {
        return loadStylesheetOnce('/assets/css/order-received.css');
      };
      window.Xentra.ensureLocationPickerCss = function () {
        return loadStylesheetOnce('/assets/css/location-picker.css');
      };
      window.Xentra.ensureCheckoutCss = function () {
        return loadStylesheetOnce('/assets/css/checkout.css');
      };

      // Gate the picker's open() on its lazy CSS so it NEVER appears unstyled.
      // The picker module itself is eager (location-picker.js loads at boot), so
      // a single wrapper here covers every caller (home / checkout / aux) without
      // touching those modules. Idempotent + falls back to opening if CSS fails.
      (function gateLocationPickerCss() {
        var P = window.XentraLocationPicker;
        if (!P || typeof P.open !== 'function' || P.__xentraCssGated) return;
        var origOpen = P.open;
        P.open = function () {
          var self = this;
          var args = arguments;
          window.Xentra.ensureLocationPickerCss()
            .then(function () { return origOpen.apply(self, args); })
            .catch(function () { return origOpen.apply(self, args); });
        };
        P.__xentraCssGated = true;
      })();

      var CONTROLLER_SRC = {
        checkout: '/assets/js/pages/checkout.js',
        'order-received': '/assets/js/pages/order-received.js',
        affiliate: '/assets/js/pages/aux-pages.js',
        history: '/assets/js/pages/aux-pages.js',
        profile: '/assets/js/pages/aux-pages.js',
        'account-settings': '/assets/js/pages/aux-pages.js'
      };

      function ensureController(view) {
        var src = CONTROLLER_SRC[view];
        if (!src) return Promise.resolve();
        if (view === 'checkout' && window.Xentra && window.Xentra.Checkout) return Promise.resolve();
        if (view === 'order-received' && window.Xentra && window.Xentra.OrderReceived) return Promise.resolve();
        if ((view === 'affiliate' || view === 'history' || view === 'profile') && window.XentraAuxPages) return Promise.resolve();
        return loadScriptOnce(src);
      }

      function updateViews(view, params) {
        var homeEl = document.getElementById('xentra-home-view');
        var checkoutEl = document.getElementById('xentra-checkout-view');
        var orderEl = document.getElementById('xentra-order-view');
        var affiliateEl = document.getElementById('xentra-affiliate-view');
        var historyEl = document.getElementById('xentra-history-view');
        var profileEl = document.getElementById('xentra-profile-view');
        var accountSettingsEl = document.getElementById('xentra-account-settings-view');

        // Hide all views first
        if (homeEl) homeEl.style.display = 'none';
        if (checkoutEl) checkoutEl.style.display = 'none';
        if (orderEl) orderEl.style.display = 'none';
        if (affiliateEl) affiliateEl.style.display = 'none';
        if (historyEl) historyEl.style.display = 'none';
        if (profileEl) profileEl.style.display = 'none';

        if (view === 'checkout') {
          if (checkoutEl) {
            // CSS must be ready BEFORE the view is revealed and mounted (no FOUC).
            // The final catch still reveals the view if CSS/controller load fails,
            // so a network hiccup can never strand the customer on a blank screen.
            window.Xentra.ensureCheckoutCss()
              .then(function () {
                checkoutEl.style.display = 'block';
                return ensureController('checkout');
              })
              .then(function () {
                var C = window.Xentra && window.Xentra.Checkout;
                if (C) C.mount(checkoutEl, params);
              })
              .catch(function () { checkoutEl.style.display = 'block'; });
            window.scrollTo(0, 0);
          }
        } else if (view === 'order-received') {
          if (orderEl) {
            // CSS must be ready BEFORE the view is shown (no unstyled flash).
            window.Xentra.ensureOrderReceivedCss()
              .then(function () {
                orderEl.style.display = 'block';
                return ensureController('order-received');
              })
              .then(function () {
                var O = window.Xentra && window.Xentra.OrderReceived;
                if (O) O.mount(orderEl, params && params.orderId);
              })
              .catch(function () {});
            window.scrollTo(0, 0);
          }
        } else if (view === 'affiliate') {
          if (affiliateEl) {
            affiliateEl.style.display = 'block';
            ensureController('affiliate').then(function () {
              if (window.XentraAuxPages) window.XentraAuxPages.mountAffiliate(affiliateEl);
            }).catch(function () {});
            window.scrollTo(0, 0);
          }
        } else if (view === 'history') {
          if (historyEl) {
            historyEl.style.display = 'block';
            ensureController('history').then(function () {
              if (window.XentraAuxPages) window.XentraAuxPages.mountHistory(historyEl);
            }).catch(function () {});
            window.scrollTo(0, 0);
          }
        } else if (view === 'profile') {
          if (profileEl) {
            profileEl.style.display = 'block';
            ensureController('profile').then(function () {
              if (window.XentraAuxPages) window.XentraAuxPages.mountProfile(profileEl);
            }).catch(function () {});
            window.scrollTo(0, 0);
          }
        } else if (view === 'account-settings') {
          if (accountSettingsEl) {
            accountSettingsEl.style.display = 'block';
            ensureController('account-settings').then(function () {
              if (window.XentraAuxPages) window.XentraAuxPages.mountAccountSettings(accountSettingsEl);
            }).catch(function () {});
            window.scrollTo(0, 0);
          }
        } else {
          // Home
          if (homeEl) {
            homeEl.style.display = 'block';
            if (window.XentraHome && typeof window.XentraHome.refresh === 'function') {
              window.XentraHome.refresh();
            }
              if (typeof window.__xentraHideSplash === 'function') {
                window.__xentraHideSplash();
              }
            window.scrollTo(0, 0);
          }
        }
      }

      Router.subscribe(updateViews);

      // Initial route
      var initialView = Router.getViewFromUrl();
      var initialOrderId = Router.getOrderIdFromUrl();
      var initialItemId = Router.getItemIdFromUrl();
      if (initialView !== 'home') {
        updateViews(initialView, { orderId: initialOrderId, itemId: initialItemId });
      }

      // Intercept Cart Link click
      var cartLink = document.getElementById('x-cart-checkout-link');
      if (cartLink) {
        cartLink.onclick = function (e) {
          e.preventDefault();
          if (window.XentraHome && typeof window.XentraHome.openCheckoutFlow === 'function') {
            window.XentraHome.openCheckoutFlow();
          } else {
            Router.navigate('checkout');
          }
        };
      }

      // ── Customer Broker Return Handler ──────────────────────────────────
      // After the Xentra Auth Broker returns from Google, the browser lands
      // back on this page with ?customer_code=xnt_chdf_* in the URL.
      // We exchange that one-time code for a proper xnt_cust_ session token,
      // then clean the URL and navigate to the saved return destination.
      (function handleCustomerBrokerReturn() {
        var urlParams = new URLSearchParams(window.location.search);
        var customerCode = urlParams.get('customer_code') || '';
        var authError = urlParams.get('error') || '';

        if (authError) {
          // Broker returned an error — clean URL and stay on home
          try {
            var cleanUrl = new URL(window.location.href);
            cleanUrl.searchParams.delete('error');
            cleanUrl.searchParams.delete('error_description');
            window.history.replaceState({}, '', cleanUrl.toString());
          } catch (_) {}
          var errDesc = urlParams.get('error_description') || 'Autentikasi Google gagal.';
          var Store = window.Xentra && window.Xentra.Store;
          var UI = window.Xentra && window.Xentra.UI;
          if (UI && UI.toast) UI.toast(errDesc);
          return;
        }

        if (!customerCode || !customerCode.startsWith('xnt_chdf_')) return;

        // Clean ?customer_code from URL immediately
        try {
          var cleanUrl = new URL(window.location.href);
          cleanUrl.searchParams.delete('customer_code');
          window.history.replaceState({}, '', cleanUrl.toString());
        } catch (_) {}

        var Store = window.Xentra && window.Xentra.Store;
        var API = window.Xentra && window.Xentra.API;
        var UI = window.Xentra && window.Xentra.UI;

        if (!API || !Store) return;

        API.post('/customer/auth/broker/exchange', { code: customerCode })
          .then(function (res) {
            if (res && res.success && res.token) {
              var customerName = (res.customer && res.customer.name) || 'Pelanggan';
              var customerEmail = (res.customer && res.customer.email) || '';
              var customerId = (res.customer && res.customer.id) || '';
              Store.setCustomerSession({
                name: customerName,
                phone: customerEmail,
                email: customerEmail,
                customerId: customerId,
                customer_id: customerId,
                token: res.token
              });
              if (UI && UI.toast) UI.toast('Berhasil masuk dengan Google!');
              // Navigate to the saved return view
              var returnHash = '';
              try { returnHash = sessionStorage.getItem('xnt_auth_return_hash') || '#profile'; } catch (_) { returnHash = '#profile'; }
              try { sessionStorage.removeItem('xnt_auth_return_hash'); } catch (_) {}
              // Navigate to saved hash view (strip '#' prefix for Router)
              var targetView = returnHash.replace(/^#/, '') || 'profile';
              Router.navigate(targetView);
            } else {
              if (UI && UI.toast) UI.toast((res && res.error) || 'Gagal menyelesaikan Google Sign-In.');
            }
          })
          .catch(function () {
            if (UI && UI.toast) UI.toast('Gagal menghubungi server saat menyelesaikan login Google.');
          });
      })();
    })();
  </script>

  <!-- ═══════════════════════════════════════════════════
       SERVICE WORKER ENGINE (Clean & Smooth)
       ═══════════════════════════════════════════════════ -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var newWorker = reg.installing;
          if (newWorker) {
            newWorker.addEventListener('statechange', function () {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                newWorker.postMessage({ action: 'skipWaiting' });
              }
            });
          }
        });
      }).catch(function (err) {
        console.warn('[PWA] Registration warn:', err);
      });

      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    }
  </script>
