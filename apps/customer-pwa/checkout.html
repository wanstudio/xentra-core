  <!-- Early theme bootstrap: apply saved brand primary color before CSS renders -->
  <script>
    (function () {
      // Early theme bootstrap: apply saved brand primary color before CSS renders to prevent theme flash
      try {
        var rawBrand = localStorage.getItem('xentra_v2_brand');
        if (rawBrand) {
          var b = JSON.parse(rawBrand);
          if (b && b.primary_color) {
            var hex = b.primary_color.trim();
            var cHex = hex.replace(/^#/, '');
            if (cHex.length === 3) cHex = cHex[0] + cHex[0] + cHex[1] + cHex[1] + cHex[2] + cHex[2];
            if (cHex.length === 6) {
              var r = parseInt(cHex.substring(0, 2), 16);
              var g = parseInt(cHex.substring(2, 4), 16);
              var bl = parseInt(cHex.substring(4, 6), 16);
              var lum = (0.299 * r + 0.587 * g + 0.114 * bl) / 255;
              var textHex = lum > 0.6 ? '#111111' : '#ffffff';
              var heroText = textHex === '#ffffff' ? '#ffffff' : '#0f172a';
              var heroSub = textHex === '#ffffff' ? '#e2e8f0' : '#1e293b';

              var rootEl = document.documentElement;
              rootEl.style.setProperty('--x-primary', hex);
              rootEl.style.setProperty('--x-lime', hex);
              rootEl.style.setProperty('--primary-color', hex);
              rootEl.style.setProperty('--x-primary-text', textHex);
              rootEl.style.setProperty('--primary-text', textHex);
              rootEl.style.setProperty('--primary-foreground', textHex);
              rootEl.style.setProperty('--x-primary-foreground', textHex);
              rootEl.style.setProperty('--x-hero-text', heroText);
              rootEl.style.setProperty('--x-hero-text-sub', heroSub);
              var m = document.querySelector('meta[name="theme-color"]');
              if (m) m.setAttribute('content', hex);
            }
          }
        }
      } catch (_) {}

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__xentra_deferred_prompt = e;
      });
    })();
  </script>

      window.Xentra = window.Xentra || {};
      window.Xentra.showSplash = function (message) {
        var el = document.getElementById('x-splash');
        if (el) {
          el.style.display = 'flex';
          var txt = document.getElementById('x-splash-text');
          if (txt && typeof message === 'string') {
            txt.textContent = message;
          }
        }
      };
      window.Xentra.hideSplash = function () {
        var el = document.getElementById('x-splash');
        if (el) el.style.display = 'none';
      };
      window.__xentraHideSplash = window.Xentra.hideSplash;

      window.addEventListener('pageshow', function () {
        if (window.Xentra && typeof window.Xentra.hideSplash === 'function') {
          window.Xentra.hideSplash();
        }
      });
    })();
  </script>

      @keyframes bot-flap-l { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
      @keyframes bot-flap-r { from { transform: rotate(22deg); } to { transform: rotate(-22deg); } }

  <!-- ═══════════════════════════════════════════════════
       SPA ROUTER & VIEW COORDINATOR
       ═══════════════════════════════════════════════════ -->
  <script>
    (function () {
      var Router = window.Xentra && window.Xentra.Router;
      var Checkout = window.Xentra && window.Xentra.Checkout;
      var OrderReceived = window.Xentra && window.Xentra.OrderReceived;

      if (!Router) return;

      function updateViews(view, params) {
        var homeEl = document.getElementById('xentra-home-view');
        var checkoutEl = document.getElementById('xentra-checkout-view');
        var orderEl = document.getElementById('xentra-order-view');

        if (view === 'checkout') {
          if (homeEl) homeEl.style.display = 'none';
          if (orderEl) orderEl.style.display = 'none';
          if (checkoutEl) {
            checkoutEl.style.display = 'block';
            if (Checkout) Checkout.mount(checkoutEl, params);
            window.scrollTo(0, 0);
          }
        } else if (view === 'order-received') {
          if (homeEl) homeEl.style.display = 'none';
          if (checkoutEl) checkoutEl.style.display = 'none';
          if (orderEl) {
            orderEl.style.display = 'block';
            if (OrderReceived) OrderReceived.mount(orderEl, params && params.orderId);
            window.scrollTo(0, 0);
          }
        } else {
          // Home
          if (checkoutEl) checkoutEl.style.display = 'none';
          if (orderEl) orderEl.style.display = 'none';
          if (homeEl) {
            homeEl.style.display = 'block';
            if (window.XentraHome && typeof window.XentraHome.refresh === 'function') {
              window.XentraHome.refresh();
            }
            window.scrollTo(0, 0);
          }
        }
      }

      Router.subscribe(updateViews);

      // Initial route
      var initialView = Router.getViewFromUrl();
      var initialOrderId = Router.getOrderIdFromUrl();
      var initialItemId = Router.getItemIdFromUrl();
      if (initialView !== 'home') {
        updateViews(initialView, { orderId: initialOrderId, itemId: initialItemId });
      }

      // Intercept Cart Link click
      var cartLink = document.getElementById('x-cart-checkout-link');
      if (cartLink) {
        cartLink.onclick = function (e) {
          e.preventDefault();
          if (window.XentraHome && typeof window.XentraHome.openCheckoutFlow === 'function') {
            window.XentraHome.openCheckoutFlow();
          } else {
            Router.navigate('checkout');
          }
        };
      }
    })();
  </script>

  <!-- ═══════════════════════════════════════════════════
       SERVICE WORKER ENGINE (Clean & Smooth)
       ═══════════════════════════════════════════════════ -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var newWorker = reg.installing;
          if (newWorker) {
            newWorker.addEventListener('statechange', function () {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                newWorker.postMessage({ action: 'skipWaiting' });
              }
            });
          }
        });
      }).catch(function (err) {
        console.warn('[PWA] Registration warn:', err);
      });

      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    }
  </script>
